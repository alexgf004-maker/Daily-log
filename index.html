};

async function persistProg(){
  await guardarProgramacion(db,{ref,get,set}, progFecha, {grupos:progGrupos, noDisponibles:progNoDisp});
}

// Empleados con vacaciones/incapacidad/permiso aprobado en esa fecha
async function empleadosAusentesFecha(fecha, empleados){
  const ausentes=[];
  const todos=await getRegistrosAll();
  empleados.forEach(u=>{
    const regs=todos[u.id];
    if(!regs) return;
    const hay=Object.values(regs).some(r=>r.fecha===fecha&&AUS_TIPOS.includes(r.tipoDia)&&(r.estadoEspecial==='aprobado'||r.estadoEspecial===undefined));
    if(hay) ausentes.push(u.id);
  });
  return ausentes;
}

async function renderArmar(){
  const cont=$('progArmarBody');
  if(!cont) return;

  const users=await getUsers();
  const empleados=users.filter(u=>u.role==='empleado'&&(u.activo===true||u.activo==='true'));
  const ausentesAuto=await empleadosAusentesFecha(progFecha, empleados);

  // Conjunto de asignados (personas y vehículos ya en algún grupo)
  const persAsignadas=new Set();
  const vehAsignados=new Set();
  progGrupos.forEach(g=>{
    (g.empleados||[]).forEach(uid=>persAsignadas.add(uid));
    if(g.vehiculo) vehAsignados.add(g.vehiculo);
  });

  // Disponibles
  const persLibres=empleados
    .filter(u=>!persAsignadas.has(u.id)&&!ausentesAuto.includes(u.id)&&!progNoDisp.personal.includes(u.id))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const conflictos=detectarConflictos(progGrupos, progVehiculos);


  // Selector de vehículo desplegable dentro del grupo
  const vehSelector=(idx,g)=>{
    if(g.area!=='campo') return '';
    const veh=g.vehiculo?progVehiculos.find(v=>v.id===g.vehiculo):null;
    if(veh){
      return `<div class="tbl-grupo-veh"><span class="tbl-asig tbl-asig-veh" onclick="event.stopPropagation();progQuitarVehiculo(${idx})">${veh.nombre} <span class="tbl-x">×</span></span></div>`;
    }
    // Sin vehículo: botón para abrir/cerrar el selector
    const abierto=progVehAbierto===idx;
    if(!abierto){
      return `<div class="tbl-grupo-veh"><button class="tbl-veh-btn" onclick="event.stopPropagation();progAbrirVeh(${idx})">+ Asignar vehículo</button></div>`;
    }
    // Selector abierto: pick-ups y motos disponibles + no disponibles en rojo
    const vehAsig=vehAsignados;
    const disp=(tipo)=>progVehiculos.filter(v=>v.tipo===tipo&&v.estado==='disponible'&&(!vehAsig.has(v.id))).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const noDisp=(tipo)=>progVehiculos.filter(v=>v.tipo===tipo&&v.estado!=='disponible').sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const opt=v=>`<span class="tbl-veh-opt" onclick="event.stopPropagation();progElegirVeh(${idx},'${v.id}')">${v.nombre}</span>`;
    const optNo=v=>`<span class="tbl-veh-opt tbl-veh-opt-no" title="${ESTADOS_VEHICULO[v.estado]?.texto||v.estado}">${v.nombre} · ${ESTADOS_VEHICULO[v.estado]?.texto||v.estado}</span>`;
    return `<div class="tbl-veh-panel" onclick="event.stopPropagation()">
      <div class="tbl-veh-panel-hd">Elegir vehículo <span class="tbl-veh-cerrar" onclick="progAbrirVeh(null)">cerrar</span></div>
      <div class="tbl-veh-sub2">Pick-ups</div>
      <div class="tbl-veh-opts">${disp('carro').map(opt).join('')||'<span class="tbl-bolsa-vacio">Ninguno libre</span>'}${noDisp('carro').map(optNo).join('')}</div>
      <div class="tbl-veh-sub2">Motos</div>
      <div class="tbl-veh-opts">${disp('moto').map(opt).join('')||'<span class="tbl-bolsa-vacio">Ninguna libre</span>'}${noDisp('moto').map(optNo).join('')}</div>
    </div>`;
  };

  // Caja de un grupo
  const cajaGrupo=(g)=>{
    const idx=progGrupos.indexOf(g);
    const personas=(g.empleados||[]).map((uid,k)=>{
      const nom=(g.empleadosNombres||[])[k]||'';
      return `<span class="tbl-asig tbl-asig-pers" onclick="event.stopPropagation();progQuitarPersona(${idx},'${uid}')">${nom} <span class="tbl-x">×</span></span>`;
    }).join('');
    return `<div class="tbl-grupo" ondragover="progDragOver(event)" ondrop="progDrop(event,${idx})" onclick="progTapCaja(${idx})">
      <div class="tbl-grupo-top">
        <span class="tbl-grupo-num">Grupo ${(g.__n||0)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${g.area==='campo'?`<input type="text" class="tbl-zona-inp" placeholder="Zona / detalle" value="${(g.zona||'').replace(/"/g,'&quot;')}" onclick="event.stopPropagation()" onchange="progSetZona(${idx},this.value)">`:''}
          <span class="tbl-grupo-del" onclick="event.stopPropagation();progEliminarGrupo(${idx})">Quitar</span>
        </div>
      </div>
      <div class="tbl-grupo-personas">${personas||'<span class="tbl-drop-hint">Toca un nombre de arriba, luego esta caja</span>'}</div>
      ${vehSelector(idx,g)}
    </div>`;
  };

  // Numerar grupos dentro de cada campaña (para etiqueta "Grupo N")
  const numerar=(gs)=>{ const porCamp={}; gs.forEach(g=>{ porCamp[g.campania]=(porCamp[g.campania]||0)+1; g.__n=porCamp[g.campania]; }); };

  // Render de campañas de un área
  const bloqueArea=(area)=>{
    const todas=progCampanias.filter(c=>c.activa!==false&&c.area===area).sort((a,b)=>a.nombre.localeCompare(b.nombre));
    // Campañas con grupos ya asignados este día (siempre visibles aunque no sean frecuentes)
    const conGrupos=new Set(progGrupos.filter(g=>g.area===area).map(g=>g.campania));
    const visibles=todas.filter(c=>c.frecuente!==false || conGrupos.has(c.nombre));
    const ocultas=todas.filter(c=>c.frecuente===false && !conGrupos.has(c.nombre));
    const abierto=progVerMas[area];

    const render=(c)=>{
      const gs=progGrupos.filter(g=>g.campania===c.nombre&&g.area===area);
      numerar(gs);
      return `<div class="tbl-camp">
        <div class="tbl-camp-hd">
          <span class="tbl-camp-nom">${c.nombre}</span>
          <button class="tbl-camp-add" onclick="progAgregarGrupo('${c.nombre.replace(/'/g,"\\'")}','${area}')">+ grupo</button>
        </div>
        ${gs.length?gs.map(cajaGrupo).join(''):'<div class="tbl-camp-vacio">Sin grupos. Toca "+ grupo".</div>'}
      </div>`;
    };

    let html=visibles.map(render).join('');
    if(abierto) html+=ocultas.map(render).join('');
    if(ocultas.length){
      html+=`<button class="tbl-vermas" onclick="progToggleVerMas('${area}')">${abierto?'Ver menos':`Ver más (${ocultas.length})`}</button>`;
    }
    return html;
  };

  cont.innerHTML=`
    <div class="page-header" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><div class="ph-title">Programación</div><div class="ph-sub">${fmtLong(progFecha).replace(/^\w/,c=>c.toUpperCase())}</div></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <input type="date" id="progFechaInput" value="${progFecha}" onchange="progCambiarFecha(this.value)" style="padding:6px 10px;font-size:13px;border:1px solid var(--gray200);border-radius:6px">
        <button class="btn btn-gh btn-sm" onclick="progCopiarAyer()">Copiar de ayer</button>
        <button class="btn btn-g btn-sm" onclick="progGenerarImagen()">Compartir imagen</button>
      </div>
    </div>

    ${progSel?`<div class="tbl-selaviso">Tocando: <b>${progSel.nombre}</b> — ahora toca un grupo para asignarlo. <span onclick="progCancelSel()" style="text-decoration:underline;cursor:pointer">cancelar</span></div>`:''}

    ${conflictos.length?`<div class="prog-avisos">
      <div style="font-weight:700;font-size:12px;margin-bottom:4px">Avisos</div>
      ${conflictos.map(a=>`<div class="prog-aviso">${a}</div>`).join('')}
    </div>`:''}

    <div class="tbl-seccion">
      <div class="tbl-seccion-hd"><span class="prog-badge-campo">Campo</span></div>
      ${bloqueArea('campo')||'<div class="prog-vacio">No hay campañas de campo.</div>'}
    </div>
    <div class="tbl-seccion">
      <div class="tbl-seccion-hd"><span class="prog-badge-plantel">Plantel</span></div>
      ${bloqueArea('plantel')||'<div class="prog-vacio">No hay campañas de plantel.</div>'}
    </div>
  `;

  // Guardar datos para el panel flotante de personal
  progPersLibres = persLibres;
  progAusentesLista = ausentesAuto.map(uid=>{const u=empleados.find(e=>e.id===uid);return u?nombreMostrar(u):'';}).filter(Boolean);
  actualizarBotonPersonal();
}

  else { progSel={tipo,id,nombre}; }

};

  ev.preventDefault();

  asignarAGrupo(idx, progDrag.tipo, progDrag.id);

// ── Asignar persona o vehículo a un grupo ──
async function asignarAGrupo(idx, tipo, id){
  const g=progGrupos[idx];
  if(!g) return;
  if(tipo==='pers'){
    if(!(g.empleados||[]).includes(id)){
      const users=await getUsers(); // cacheado, no golpea la red si es reciente
      const u=users.find(x=>x.id===id);
      g.empleados=g.empleados||[]; g.empleadosNombres=g.empleadosNombres||[];
      g.empleados.push(id); g.empleadosNombres.push(nombreMostrar(u));
    }
  } else if(tipo==='veh'){
    if(g.area==='plantel'){ /* plantel no lleva vehículo */ }
    else {
      const veh=progVehiculos.find(v=>v.id===id);
      if(veh && veh.estado!=='disponible'){ return; }
      g.vehiculo=id; g.vehiculoNombre=veh?veh.nombre:'';
    }
  }
  renderArmar();          // redibuja de inmediato (no espera a Firebase)
  persistProg();          // guarda en segundo plano
}

window.progQuitarPersona=(idx,uid)=>{
  const g=progGrupos[idx]; if(!g) return;
  const k=(g.empleados||[]).indexOf(uid);
  if(k>=0){ g.empleados.splice(k,1); (g.empleadosNombres||[]).splice(k,1); }
  renderArmar(); persistProg();
};
window.progQuitarVehiculo=(idx)=>{
  const g=progGrupos[idx]; if(!g) return;
  g.vehiculo=''; g.vehiculoNombre='';
  renderArmar(); persistProg();
};

window.progAbrirVeh=(idx)=>{ progVehAbierto=idx; renderArmar(); };
window.progElegirVeh=(idx,vid)=>{
  const g=progGrupos[idx]; if(!g) return;
  const veh=progVehiculos.find(v=>v.id===vid);
  if(veh && veh.estado!=='disponible') return; // no disponibles no se asignan
  g.vehiculo=vid; g.vehiculoNombre=veh?veh.nombre:'';
  progVehAbierto=null;
  renderArmar(); persistProg();
};
window.progVerNoDisp=async()=>{
  const users=await getUsers();
  const empleados=users.filter(u=>u.role==='empleado'&&(u.activo===true||u.activo==='true'));
  const ausentesAuto=await empleadosAusentesFecha(progFecha, empleados);
  const nombres=ausentesAuto.map(uid=>{const u=empleados.find(e=>e.id===uid);return u?nombreMostrar(u):'';}).filter(Boolean);
  if(!nombres.length){ alert('No hay personal marcado como no disponible hoy.'); return; }
  alert('No disponibles hoy (vacaciones/permiso/incapacidad):\n\n'+nombres.join('\n'));
};

  if(!cont) return;
  const q=($('panelBuscar')?.value||'').toLowerCase().trim();

// ── GENERAR IMAGEN PARA WHATSAPP ──
window.progGenerarImagen=async()=>{
  if(!progGrupos.length){ alert('No hay grupos en la programación de este día.'); return; }

  // Ausentes del día (incapacidad/permiso/vacaciones)
  const users=await getUsers();
  const empleados=users.filter(u=>u.role==='empleado'&&(u.activo===true||u.activo==='true'));
  const ausentes={vacaciones:[],incapacidad:[],permiso:[],bienestar:[],injustificado:[]};
  const todosRegs=await getRegistrosAll();
  empleados.forEach(u=>{
    const regs=todosRegs[u.id];
    if(!regs) return;
    const reg=Object.values(regs).find(r=>r.fecha===progFecha&&AUS_TIPOS.includes(r.tipoDia)&&(r.estadoEspecial==='aprobado'||r.estadoEspecial===undefined));
    if(reg) ausentes[reg.tipoDia].push(nombreMostrar(u));
  });

  const campo=progGrupos.filter(g=>g.area==='campo');
  const plantel=progGrupos.filter(g=>g.area==='plantel');

  // ── Dibujo en canvas ──
  const W=1080;
  const scale=2; // nitidez retina
  const pad=48;
  const azul='#1e3a5f', azulClaro='#2563eb', verde='#059669', gris='#64748b', texto='#0f172a';

  // Primera pasada: medir alto necesario
  const headH=170;      // encabezado
  const seccH=58;       // título de sección
  const cardHt=76;      // tarjeta de grupo + gap (holgado por si va a 2 líneas)
  const campTit=38;     // título de campaña + aire
  const campoCamps=new Set(campo.map(g=>g.campania)).size;
  const plantelCamps=new Set(plantel.map(g=>g.campania)).size;
  let alto=headH;
  if(campo.length){ alto+=seccH+campoCamps*campTit+campo.length*cardHt+30; }
  if(plantel.length){ alto+=seccH+plantelCamps*campTit+plantel.length*cardHt+30; }
  const totalAusentes=ausentes.vacaciones.length+ausentes.incapacidad.length+ausentes.permiso.length+ausentes.bienestar.length+ausentes.injustificado.length;
  if(totalAusentes){ alto+=seccH; ['vacaciones','incapacidad','permiso','bienestar','injustificado'].forEach(k=>{ if(ausentes[k].length)alto+=44; }); alto+=16; }
  alto+=pad;

  const canvas=document.createElement('canvas');
  canvas.width=W*scale; canvas.height=alto*scale;
  const ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);

  // Fondo
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,alto);

  // Encabezado azul
  ctx.fillStyle=azul; ctx.fillRect(0,0,W,120);
  ctx.fillStyle='#ffffff';
  ctx.font='800 34px "Plus Jakarta Sans", sans-serif';
  ctx.fillText('PROGRAMACIÓN', pad, 56);
  ctx.font='500 22px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle='#cbd5e1';
  const fechaTxt=fmtLong(progFecha).replace(/^\w/,c=>c.toUpperCase());
  ctx.fillText(fechaTxt, pad, 92);
  ctx.font='700 18px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle='#4ade80';
  ctx.textAlign='right';
  ctx.fillText('INNOVA', W-pad, 56);
  ctx.textAlign='left';

  let y=headH;

  const dibujarSeccion=(titulo, color)=>{
    ctx.fillStyle=color;
    ctx.font='800 24px "Plus Jakarta Sans", sans-serif';
    ctx.fillText(titulo, pad, y);
    ctx.strokeStyle=color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(pad, y+12); ctx.lineTo(W-pad, y+12); ctx.stroke();
    y+=seccH;
  };

  // Rectángulo redondeado
  const rrect=(x,yy,w,h,r)=>{
    ctx.beginPath();
    ctx.moveTo(x+r,yy);
    ctx.arcTo(x+w,yy,x+w,yy+h,r);
    ctx.arcTo(x+w,yy+h,x,yy+h,r);
    ctx.arcTo(x,yy+h,x,yy,r);
    ctx.arcTo(x,yy,x+w,yy,r);
    ctx.closePath();
  };

  // Dibuja una tarjeta de grupo (pareja): fondo suave, personal izquierda, zona + vehículo
  const cardH=48; // alto de cada tarjeta
  const dibujarCard=(g)=>{
    // Medir vehículo primero para saber el límite derecho
    let vw=0, veh=null;
    if(g.vehiculo){
      veh=progVehiculos.find(v=>v.id===g.vehiculo);
      if(veh){ ctx.font='700 17px "Plus Jakarta Sans", sans-serif'; vw=ctx.measureText(veh.nombre).width+22; }
    }
    const limiteDerecho = veh ? (W-pad-14-vw-12) : (W-pad-14);

    // Zona: medir su ancho para saber dónde empieza el personal
    let zx=pad+14, zw=0;
    if(g.zona){ ctx.font='700 15px "Plus Jakarta Sans", sans-serif'; zw=ctx.measureText(g.zona).width+18; }
    const tx = g.zona ? (zx+zw+10) : (pad+14);
    const anchoDisp=limiteDerecho-tx;

    // Preparar líneas de personal (envolver a 2 si no cabe)
    ctx.font='600 18px "Plus Jakarta Sans", sans-serif';
    const nombres=(g.empleadosNombres||[]);
    const textoCompleto=nombres.join(' · ');
    let lineas=[textoCompleto];
    if(ctx.measureText(textoCompleto).width>anchoDisp && nombres.length>1){
      // Partir en 2 líneas lo más equilibrado posible respetando el ancho
      lineas=[]; let actual='';
      nombres.forEach((n,i)=>{
        const cand = actual ? actual+' · '+n : n;
        if(ctx.measureText(cand).width>anchoDisp && actual){
          lineas.push(actual); actual=n;
        } else { actual=cand; }
      });
      if(actual) lineas.push(actual);
      // Máximo 2 líneas: si se pasó, reagrupa el resto en la segunda
      if(lineas.length>2){
        const prim=lineas[0];
        const resto=nombres.slice(prim.split(' · ').length).join(' · ');
        lineas=[prim, resto];
      }
    }
    const dobleLinea = lineas.length>1;
    const hCard = dobleLinea ? cardH+22 : cardH;

    // Fondo (alto según líneas)
    ctx.fillStyle='#f1f5f9';
    rrect(pad, y, W-pad*2, hCard, 10);
    ctx.fill();
    const cy=y+hCard/2;

    // Vehículo (chip verde, centrado vertical)
    if(veh){
      ctx.font='700 17px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle='#d1fae5';
      rrect(W-pad-14-vw, cy-14, vw, 28, 7); ctx.fill();
      ctx.fillStyle='#047857';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(veh.nombre, W-pad-14-vw/2, cy);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }

    // Zona (chip azul, centrado vertical)
    if(g.zona){
      ctx.font='700 15px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle='#dbeafe';
      rrect(zx, cy-13, zw, 26, 7); ctx.fill();
      ctx.fillStyle=azulClaro; ctx.textBaseline='middle';
      ctx.fillText(g.zona, zx+9, cy);
      ctx.textBaseline='alphabetic';
    }

    // Personal (1 o 2 líneas)
    ctx.fillStyle=texto;
    ctx.font='600 18px "Plus Jakarta Sans", sans-serif';
    ctx.textBaseline='middle';
    if(!dobleLinea){
      ctx.fillText(lineas[0], tx, cy);
    } else {
      ctx.fillText(lineas[0], tx, cy-12);
      ctx.fillText(lineas[1], tx, cy+12);
    }
    ctx.textBaseline='alphabetic';
    y+=hCard+5;
  };

  // Dibuja todos los grupos de un área, agrupando por campaña
  const dibujarArea=(grupos)=>{
    // Agrupar por nombre de campaña, preservando orden de aparición
    const orden=[]; const porCamp={};
    grupos.forEach(g=>{ if(!porCamp[g.campania]){porCamp[g.campania]=[];orden.push(g.campania);} porCamp[g.campania].push(g); });
    // Verificación de factibilidad siempre al final
    orden.sort((a,b)=>{
      const fa=/factibilidad/i.test(a)?1:0, fb=/factibilidad/i.test(b)?1:0;
      return fa-fb;
    });
    orden.forEach((nombre,ci)=>{
      const gs=porCamp[nombre];
      if(ci>0) y+=14; // aire entre campañas
      // Título de la campaña
      ctx.fillStyle=texto;
      ctx.font='700 20px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(nombre, pad, y);
      y+=12;
      // Cada grupo (pareja) como tarjeta
      gs.forEach(dibujarCard);
    });
  };

  if(campo.length){
    dibujarSeccion('CAMPO', azulClaro);
    dibujarArea(campo);
    y+=16;
  }
  if(plantel.length){
    dibujarSeccion('PLANTEL', '#d97706');
    dibujarArea(plantel);
    y+=16;
  }

  if(totalAusentes){
    dibujarSeccion('NO DISPONIBLES', gris);
    ctx.font='500 19px "Plus Jakarta Sans", sans-serif';
    const linea=(etq,arr)=>{
      if(!arr.length) return;
      ctx.fillStyle=texto; ctx.font='700 19px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(etq+':', pad, y);
      ctx.fillStyle=gris; ctx.font='500 19px "Plus Jakarta Sans", sans-serif';
      ctx.fillText(arr.join(', '), pad+ctx.measureText(etq+': ').width+8, y);
      y+=44;
    };
    linea('Vacaciones', ausentes.vacaciones);
    linea('Incapacidad', ausentes.incapacidad);
    linea('Permiso', ausentes.permiso);
    linea('Día de bienestar', ausentes.bienestar);
    linea('Permiso injustificado', ausentes.injustificado);
  }

  // ── Compartir o descargar ──
  canvas.toBlob(async (blob)=>{
    const nombreArch=`Programacion-${progFecha}.png`;
    const file=new File([blob], nombreArch, {type:'image/png'});
    // Intentar compartir nativo (celular)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Programación', text:'Programación '+fechaTxt});
        return;
      }catch(e){ /* si cancela, cae a descarga */ }
    }
    // Descargar como respaldo
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=nombreArch; a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
};

// Calcula el arreglo de fechas (YYYY-MM-DD) según tipo
function ausenciaFechas(tipo, ini, dias, fin){
  const out=[];
  const d0=new Date(ini+'T12:00:00');
  if(tipo==='permiso'||tipo==='bienestar'||tipo==='injustificado'){ out.push(ini); return out; }
  if(tipo==='incapacidad'){
    const n=Math.max(1, parseInt(dias||'1',10));
    for(let i=0;i<n;i++){ const d=new Date(d0); d.setDate(d.getDate()+i); out.push(d.toISOString().split('T')[0]); }
    return out;
  }
  // vacaciones: rango ini..fin
  const df=new Date(fin+'T12:00:00');
  for(let d=new Date(d0); d<=df; d.setDate(d.getDate()+1)){ out.push(d.toISOString().split('T')[0]); }
  return out;
}

window.guardarAusenciaUI=async()=>{
  const al=$('moAusenciaAlert');
  const uid=$('ausEmpleado').value;
  const tipo=$('ausTipo').value;
  const ini=$('ausIni').value;
  const dias=$('ausDias').value;
  const fin=$('ausFin').value;
  const nota=$('ausNota').value.trim();
  if(!uid){ al.innerHTML='<div class="alert ae" style="font-size:12px">Selecciona un empleado.</div>'; return; }
  if(!ini){ al.innerHTML='<div class="alert ae" style="font-size:12px">Selecciona la fecha de inicio.</div>'; return; }
  if(tipo==='vacaciones'){
    if(!fin){ al.innerHTML='<div class="alert ae" style="font-size:12px">Selecciona la fecha de fin.</div>'; return; }
    if(fin<ini){ al.innerHTML='<div class="alert ae" style="font-size:12px">La fecha fin debe ser mayor o igual a inicio.</div>'; return; }
  }
  if(tipo==='incapacidad'){
    const n=parseInt(dias||'0',10);
    if(!n||n<1){ al.innerHTML='<div class="alert ae" style="font-size:12px">Indica cuántos días.</div>'; return; }
  }

  const fechas=ausenciaFechas(tipo, ini, dias, fin);
  const users=await getUsers();
  const emp=users.find(u=>u.id===uid);

  // Registros existentes del empleado (para no duplicar)
  const snap=await get(ref(db,`registros/${uid}`));
  const existentes=new Set();
  if(snap.exists()){
    Object.values(snap.val()).forEach(r=>{ if(r.fecha) existentes.add(r.fecha); });
  }

  let escritos=0, saltadosCerrado=0, saltadosExiste=0;
  const promesas=[];
  for(const fecha of fechas){
    if(mesCerrado(fecha)){ saltadosCerrado++; continue; }
    if(existentes.has(fecha)){ saltadosExiste++; continue; }
    promesas.push(push(ref(db,`registros/${uid}`),{
      fecha, tipoDia:tipo,
      actividades:'', viatico:false, he:false,
      estadoViatico:'na', estadoHE:'na',
      estadoEspecial:'aprobado',
      ...(tipo==='vacaciones'?{vacIni:ini,vacFin:fin}:{}),
      nota:nota||AUS_TIPO_LABEL[tipo],
      userId:uid, userName:emp?emp.nombre:'', cargo:emp?.cargo||'',
      creadoEn:Date.now(), autoGenerado:true, registradoPorAdmin:true
    }));
    escritos++;
  }
  try{ if(promesas.length) await Promise.all(promesas); }
  catch(e){ al.innerHTML='<div class="alert ae" style="font-size:12px">Error al guardar. Revisa tu conexión.</div>'; return; }

  invalidarRegsCache();
  closeModal('moAusencia');
  let msg=`Se registraron ${escritos} día(s) de ${AUS_TIPO_LABEL[tipo].toLowerCase()} para ${emp?emp.nombre:''}.`;
  if(saltadosExiste) msg+=`\n${saltadosExiste} día(s) ya tenían registro y se respetaron.`;
  if(saltadosCerrado) msg+=`\n${saltadosCerrado} día(s) caían en un mes cerrado y se omitieron.`;
  alert(msg);
  renderAusencias();
};

async function renderAusencias(){
  const cont=$('ausLista');
  if(!cont) return;
  cont.innerHTML='<div class="spin"></div>';
  const users=await getUsers();
  const empleados=users.filter(u=>u.role==='empleado');
  const hoy=today();

  // Recolectar ausencias activas/futuras (registros tipo incapacidad/vacaciones/permiso con fecha >= hoy)
  // Agrupamos por empleado+tipo+bloque contiguo para mostrar rangos
  const items=[];
  const todosRegs=await getRegistrosAll();
  empleados.forEach(u=>{
    const raw=todosRegs[u.id];
    if(!raw) return;
    const regs=Object.entries(raw)
      .map(([key,r])=>({key,...r}))
      .filter(r=>AUS_TIPOS.includes(r.tipoDia)&&r.fecha&&r.fecha>=hoy)
      .sort((a,b)=>a.fecha.localeCompare(b.fecha));
    if(!regs.length) return;
    // Agrupar días contiguos del mismo tipo en un rango
    let bloque=null;
    regs.forEach(r=>{
      if(bloque && bloque.tipo===r.tipoDia && esDiaSiguiente(bloque.fin, r.fecha)){
        bloque.fin=r.fecha; bloque.keys.push(r.key); bloque.dias++;
      } else {
        if(bloque) items.push(bloque);
        bloque={uid:u.id, nombre:u.nombre, tipo:r.tipoDia, ini:r.fecha, fin:r.fecha, dias:1, keys:[r.key], nota:r.nota||''};
      }
    });
    if(bloque) items.push(bloque);
  });

  items.sort((a,b)=>a.ini.localeCompare(b.ini)||a.nombre.localeCompare(b.nombre));

  if(!items.length){
    cont.innerHTML='<div class="empty" style="padding:24px"><div class="et">No hay ausencias activas ni próximas</div><div class="es">Toca "+ Ausencia" para registrar una.</div></div>';
    return;
  }

  const badge={incapacidad:'br',vacaciones:'ba',permiso:'by',bienestar:'ba',injustificado:'br'};
  cont.innerHTML=`<div class="card" style="padding:0">${items.map(it=>{
    const rango = it.ini===it.fin ? fmt(it.ini) : `${fmt(it.ini)} — ${fmt(it.fin)}`;
    return `<div class="aus-row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${it.nombre}</div>
        <div style="font-size:12px;color:var(--text2)">${rango} · ${it.dias} día(s)</div>
      </div>
      <span class="badge ${badge[it.tipo]||'bn'}" style="font-size:11px">${AUS_TIPO_LABEL[it.tipo]}</span>
      <span class="aus-del" onclick='eliminarAusencia(${JSON.stringify(it.keys)},"${it.uid}","${(it.nombre||'').replace(/"/g,'')}")'>Quitar</span>
    </div>`;
  }).join('')}</div>`;
}

function esDiaSiguiente(fecha1, fecha2){
  const d1=new Date(fecha1+'T12:00:00'); d1.setDate(d1.getDate()+1);
  return d1.toISOString().split('T')[0]===fecha2;
}

window.quitarSedeATodos=async()=>{
  if(!confirm('Esto quitará la sede asignada a TODOS los empleados. ¿Continuar?')) return;
  const users=await getUsers();
  const emps=users.filter(u=>u.role==='empleado');
  await Promise.all(emps.map(u=>update(ref(db,`users/${u.id}`),{sede:''})));
  alert(`Sede quitada a ${emps.length} empleados.`);
  loadUsrs();
};
window.onRolChange=async(rol)=>{
  const sec=$('secEmpleadosAsig');
  const secSede=$('secSede');
  if(sec){
    if(rol==='asistente'){ sec.style.display='block'; await cargarListaEmpleadosAsig([]); }
    else sec.style.display='none';
  }
  if(secSede){ secSede.style.display=(rol==='empleado')?'block':'none'; }
};

async function cargarListaEmpleadosAsig(seleccionados=[]){
  const l=$('listaEmpleadosAsig'); if(!l) return;
  const users=await getUsers();
  const emps=users.filter(u=>u.role==='empleado'&&(u.activo===true||u.activo==='true'));
  emps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  l.innerHTML=emps.map(u=>`
    <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--gray100)">
      <input type="checkbox" value="${u.id}" ${seleccionados.includes(u.id)?'checked':''} style="width:16px;height:16px;accent-color:var(--blue)">
      <span>${u.nombre}</span>
    </label>`).join('');
}

window.openModalUser=async(uid)=>{
  editUID=uid||null;
  $('moUsrTitle').textContent=uid?'Editar usuario':'Nuevo usuario';
  $('moUsrAlert').innerHTML='';
  ['uNom','uNomCorto','uCargo','uUsr','uPin'].forEach(id=>{if($(id))$(id).value='';});
  $('uRol').value='empleado';
  $('secEmpleadosAsig').style.display='none';
  if($('uSede')) $('uSede').value='';
  if($('secSede')) $('secSede').style.display='block';
  if(uid){
    const s=await get(ref(db,`users/${uid}`));
    if(s.exists()){
      const u=s.val();
      $('uNom').value=u.nombre;
      if($('uNomCorto')) $('uNomCorto').value=u.nombreCorto||'';
      if($('uCargo')) $('uCargo').value=u.cargo||'';
      $('uUsr').value=u.username;
      $('uRol').value=u.role==='asistente'?'asistente':'empleado';
      if(u.role==='asistente'){
        $('secEmpleadosAsig').style.display='block';
        if($('secSede')) $('secSede').style.display='none';
        await cargarListaEmpleadosAsig(u.empleadosAsig||[]);
      }
      if($('uSede')) $('uSede').value=u.sede||'';
    }
  }
  $('moUsr').classList.add('open');
};

window.saveUser=async()=>{
  const al=$('moUsrAlert');
  const nom=$('uNom').value.trim(),usr=$('uUsr').value.trim().toLowerCase(),pin=$('uPin').value.trim();
  const nomCorto=$('uNomCorto')?$('uNomCorto').value.trim():'';
  const cargo=$('uCargo')?$('uCargo').value.trim():'';
  const rol=$('uRol').value||'empleado';
  if(!nom||!usr){al.innerHTML='<div class="alert ae">Nombre y usuario son obligatorios.</div>';return;}
  if(!editUID&&(!pin||pin.length<4)){al.innerHTML='<div class="alert ae">PIN mínimo de 4 dígitos.</div>';return;}
  const users=await getUsers();
  if(users.find(u=>u.username===usr&&u.id!==editUID)){al.innerHTML='<div class="alert ae">Ese usuario ya existe.</div>';return;}
  // Obtener empleados asignados si es asistente
  let empleadosAsig=[];
  if(rol==='asistente'){
    const checks=document.querySelectorAll('#listaEmpleadosAsig input[type=checkbox]:checked');
    empleadosAsig=Array.from(checks).map(c=>c.value);
  }
  const sede=(rol==='empleado'&&$('uSede'))?($('uSede').value||''):'';
  if(editUID){
    const d={nombre:nom,nombreCorto:nomCorto,cargo,username:usr,role:rol,empleadosAsig:rol==='asistente'?empleadosAsig:[],sede};
    if(pin.length>=4){ d.pin=await savePIN(pin); }
    await update(ref(db,`users/${editUID}`),d);
  } else {
    await set(push(ref(db,'users')),{nombre:nom,nombreCorto:nomCorto,cargo,username:usr,pin:await savePIN(pin),role:rol,activo:true,empleadosAsig:rol==='asistente'?empleadosAsig:[],sede});
  }
  closeModal('moUsr');loadUsrs();
};

window.closeModal=id=>$(id).classList.remove('open');
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mo.open').forEach(m=>m.classList.remove('open'));});

// Lock scroll on login screen at startup
document.body.style.overflow='hidden';
</script>
</body>
</html>
