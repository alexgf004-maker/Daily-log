<script>
// ── PWA SETUP ──────────────────────────────────────────
(function(){
  // SVG icon — documento con barra verde y letra I
  const iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="96" fill="#1e3a5f"/>
    <rect x="48" y="80" width="8" height="352" rx="4" fill="#4ade80"/>
    <rect x="96" y="140" width="320" height="44" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="96" y="220" width="240" height="32" rx="10" fill="#60a5fa" opacity="0.8"/>
    <rect x="96" y="280" width="280" height="32" rx="10" fill="#60a5fa" opacity="0.6"/>
    <rect x="96" y="340" width="200" height="32" rx="10" fill="#60a5fa" opacity="0.4"/>
    <text x="256" y="175" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#1e3a5f" text-anchor="middle" dominant-baseline="middle">INNOVA</text>
  </svg>`;

  const svgBlob = new Blob([iconSVG], {type:'image/svg+xml'});
  const iconURL = URL.createObjectURL(svgBlob);

  // Generate PNG icon via canvas for better compatibility
  function makePNG(size, cb){
    const img = new Image();
    img.onload = function(){
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, 0, 0, size, size);
      cb(c.toDataURL('image/png'));
    };
    img.src = iconURL;
  }

  // Apple touch icon
  makePNG(180, function(png){
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = png;
    document.head.appendChild(link);
  });

  // Favicon
  makePNG(32, function(png){
    const link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/png';
    link.href = png;
    document.head.appendChild(link);

    // PWA Manifest
    makePNG(192, function(png192){
      makePNG(512, function(png512){
        const manifest = {
          name: 'INNOVA · Registro de Planilla',
          short_name: 'INNOVA',
          description: 'Registro de actividades — Servicios técnicos y comerciales',
          start_url: './',
          display: 'standalone',
          background_color: '#1e3a5f',
          theme_color: '#1e3a5f',
          orientation: 'portrait',
          icons: [
            { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
        const mURL = URL.createObjectURL(mBlob);
        const ml = document.createElement('link');
        ml.rel = 'manifest'; ml.href = mURL;
        document.head.appendChild(ml);
      });
    });
  });

  // Service Worker (inline via blob) — cache básico para offline
  if('serviceWorker' in navigator){
    const swCode = `
const CACHE = 'innova-v4';
self.addEventListener('install', e => {
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys=>Promise.all(
      keys.filter(k=>k!=='innova-v3').map(k=>caches.delete(k))
    )).then(()=>clients.claim())
  );
});
self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  // Network first — siempre busca la versión más reciente
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request))
  );
});`;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL, {scope:'./'}).catch(()=>{});
  }
})();
</script>

// mesCerrado -> importado de utils.js
async function hashPIN(pin){
  const msgBuffer = new TextEncoder().encode('INNOVA_SALT_2025_' + pin);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPIN(pin, stored){
  // Si el stored ya es un hash (64 chars hex), comparar con hash
  if(stored && stored.length === 64){
    const h = await hashPIN(pin);
    return h === stored;
  }
  // Compatibilidad hacia atrás: PIN en texto plano (migración)
  return String(pin) === String(stored);
}

async function savePIN(pin){
  return await hashPIN(pin);
}
async function checkMaintenance(){
  try{
    const snap=await get(ref(db,'config/mantenimiento'));
    return snap.exists()&&snap.val()===true;
  }catch(e){return false;}
}

window.maintLogin=async()=>{
  const u=$('maintUser').value.trim().toLowerCase();
  const p=$('maintPin').value.trim();
  const al=$('maintAlert'); al.innerHTML='';
  if(!u||!p){al.innerHTML='<div class="alert ae">Ingresa usuario y PIN.</div>';return;}
  let snap;
  try{snap=await get(ref(db,'users'));}catch(e){al.innerHTML='<div class="alert ae">Error de conexión.</div>';return;}
  if(!snap.exists()) return;
  let found=null;
  for(const [k,v] of Object.entries(snap.val())){
    if(v&&v.username===u){
      const ok = await verifyPIN(p, v.pin);
      if(ok) found={id:k,...v};
    }
  }
  if(!found||found.role!=='admin'){al.innerHTML='<div class="alert ae">Solo el administrador puede acceder en mantenimiento.</div>';return;}
  if(!found.activo){al.innerHTML='<div class="alert ae">Usuario inactivo.</div>';return;}
  me=found;
  localStorage.setItem('innova_session',JSON.stringify(me));
  renderAdmin(); screen('adminScreen'); loadDash(); startDashRefresh();
};
const _mp=$('maintPin'); if(_mp) _mp.addEventListener('keydown',e=>{if(e.key==='Enter')window.maintLogin();});

window.doLogin = async ()=>{
  const u=$('loginUser').value.trim().toLowerCase();
  const p=$('loginPin').value.trim();
  const al=$('loginAlert'); al.innerHTML='';
  if(!u||!p){al.innerHTML='<div class="alert ae">Ingresa tu usuario y PIN.</div>';return;}
  let snap;
  try{snap=await get(ref(db,'users'));}catch(e){al.innerHTML='<div class="alert ae">Error de conexión. Revisa las reglas de Firebase.</div>';return;}
  if(!snap.exists()){al.innerHTML='<div class="alert ae">Sin usuarios registrados.</div>';return;}
  let found=null;
  const raw=snap.val();
  for(const [k,v] of Object.entries(raw)){
    if(v && v.username===u){
      const ok = await verifyPIN(p, v.pin);
      if(ok) found={id:k,...v};
    }
  }
  if(!found){al.innerHTML='<div class="alert ae">Usuario o PIN incorrecto.</div>';return;}
  if(!found.activo){al.innerHTML='<div class="alert ae">Usuario inactivo.</div>';return;}
  // Verificar mantenimiento — solo admin puede entrar
  const enMant=await checkMaintenance();
  if(enMant&&found.role!=='admin'){
    al.innerHTML='<div class="alert ae">La aplicación está en mantenimiento. Solo el administrador puede acceder.</div>';return;
  }
  me=found;
  localStorage.setItem('innova_session', JSON.stringify(me));
  if(me.role==='admin'||me.role==='asistente'){
    renderAdmin(); screen('adminScreen'); loadDash(); startDashRefresh();
  } else {
    renderEmployee(me.nombre); screen('employeeScreen'); initForm();
  }
};

// ── RESTORE SESSION ON PAGE LOAD ──────────────────
(async()=>{
  try{
    // Verificar mantenimiento primero
    const enMant=await checkMaintenance();
    if(enMant){
      // Solo admin puede pasar — si hay sesión guardada de admin, dejarla pasar
      const saved=localStorage.getItem('innova_session');
      if(saved){
        try{
          const user=JSON.parse(saved);
          const snap=await get(ref(db,`users/${user.id}`));
          if(snap.exists()){
            const fresh=snap.val();
            if(fresh.activo&&fresh.role==='admin'){
              me={id:user.id,...fresh};
              localStorage.setItem('innova_session',JSON.stringify(me));
              renderAdmin(); screen('adminScreen'); loadDash(); startDashRefresh();
              return;
            }
          }
        }catch(e){}
      }
      screen('maintenanceScreen');
      document.body.style.overflow='hidden';
      return;
    }

    // Sin mantenimiento — restaurar sesión normal
    const saved = localStorage.getItem('innova_session');
    if(!saved){ screen('loginScreen'); return; }
    try {
      const user = JSON.parse(saved);
      if(!user||!user.id||!user.username){ screen('loginScreen'); return; }
      const snap = await get(ref(db,`users/${user.id}`));
      if(!snap.exists()) { localStorage.removeItem('innova_session'); screen('loginScreen'); return; }
      const fresh = snap.val();
      if(!fresh.activo) { localStorage.removeItem('innova_session'); screen('loginScreen'); return; }
      me = {id:user.id, ...fresh};
      localStorage.setItem('innova_session', JSON.stringify(me));
      if(me.role==='admin'||me.role==='asistente'){
        renderAdmin(); screen('adminScreen'); loadDash(); startDashRefresh();
      } else {
        renderEmployee(me.nombre); screen('employeeScreen'); initForm();
      }
    } catch(e) { localStorage.removeItem('innova_session'); screen('loginScreen'); }
  } catch(e){
    // Cualquier fallo inesperado — no dejar al usuario atrapado en la pantalla de carga
    screen('loginScreen');
  }
})();

window.actualizarResumenVac=function(){
  const ini=$('vacIni')?.value, fin=$('vacFin')?.value;
  const el=$('vacResumen'); if(!el) return;
  if(!ini||!fin){el.textContent='';return;}
  if(fin<ini){el.innerHTML='<span style="color:var(--danger)">La fecha fin debe ser mayor o igual a inicio.</span>';return;}
  const d1=new Date(ini+'T12:00:00'), d2=new Date(fin+'T12:00:00');
  const dias=Math.round((d2-d1)/(1000*60*60*24))+1;
  el.innerHTML=`<span style="color:var(--blue)">${dias} día${dias>1?'s':''} — del ${fmt(ini)} al ${fmt(fin)}</span>`;
};

let toastEmpTimer;
function showToastEmp(msg, duration=3500){
  clearTimeout(toastEmpTimer);
  let t=document.getElementById('toastEmp');
  if(!t){
    t=document.createElement('div');
    t.id='toastEmp';
    t.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:#1e3a5f;color:#fff;padding:12px 20px;border-radius:10px;
      font-family:var(--sans);font-size:13px;font-weight:500;
      box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:999;
      max-width:320px;width:90%;text-align:center;
      transition:opacity .3s;white-space:pre-line`;
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  t.style.display='block';
  toastEmpTimer=setTimeout(()=>{
    t.style.opacity='0';
    setTimeout(()=>t.style.display='none', 300);
  }, duration);
}

    // Restaurar restricción de fecha
    const f=$('empFecha');
    if(f){ f.max=today(); }
    const fecha=$('empFecha')?.value;
    esAsueto(fecha).then(a=>{
      if(a){
        const al=$('empAlert');
        if(al) al.innerHTML=`<div class="alert" style="background:var(--warnlt);color:var(--warn);border-left:3px solid var(--warn);margin-bottom:12px">
          ⚠️ Día de asueto (<b>${a.nombre}</b>) — todas las horas que registres contarán como horas extras.
        </div>`;
      }
    });
    window.onFechaChange();
  } else {
    hide('camposNormal');hide('heResumen');hide('heBox');
    show('camposEspecial');
    if(tipo==='vacaciones'){
      show('camposVacaciones');hide('camposOtroEspecial');
      // Sin restricción de fecha máxima para vacaciones futuras
      const vacI=$('vacIni'), vacF=$('vacFin');
      if(vacI) vacI.removeAttribute('max');
      if(vacF) vacF.removeAttribute('max');
      const f=$('empFecha')?.value;
      if(f){$('vacIni').value=f;$('vacFin').value=f;actualizarResumenVac();}
    } else {
      hide('camposVacaciones');show('camposOtroEspecial');
    }
  }
};

async function mostrarResumenMesAnterior(){

  const mesStr=`${mesAnt.getFullYear()}-${String(mesAnt.getMonth()+1).padStart(2,'0')}`;

    const hePend=regs.filter(r=>r.he&&r.estadoHE==='pendiente').length;
    const hrs=Math.floor(minHE/60), mins=minHE%60;

      box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:1000;
      animation:cierrePop .35s cubic-bezier(.34,1.56,.64,1) forwards;text-align:center;`;

      <div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px">Resumen de ${nomMes}</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:16px">Esto es lo que registraste el mes pasado</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
        <div style="background:var(--bluelt);border-radius:8px;padding:10px">
          <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--blue)">${totalRegs}</div>
          <div style="font-size:10px;color:var(--text2);margin-top:2px">Registros</div>
        </div>
        <div style="background:var(--greenlt);border-radius:8px;padding:10px">
          <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green)">${viaticos}</div>
          <div style="font-size:10px;color:var(--text2);margin-top:2px">Viáticos</div>
        </div>
        <div style="background:var(--warnlt);border-radius:8px;padding:10px">
          <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--warn)">${heStr}</div>
          <div style="font-size:10px;color:var(--text2);margin-top:2px">HE aprobadas</div>
        </div>
      </div>
      ${viaticosAnul>0||heRechaz>0||hePend>0?`
      <div style="background:var(--dangerlt);border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;color:var(--danger);text-align:left">
        ${viaticosAnul>0?`⚠️ ${viaticosAnul} viático${viaticosAnul>1?'s anulados':' anulado'}<br>`:''}
        ${heRechaz>0?`⚠️ ${heRechaz} HE rechazada${heRechaz>1?'s':''}<br>`:''}

    </button>`;

    st.id='cierreMesStyle';
    st.textContent=`@keyframes cierrePop{from{opacity:0;transform:translate(-50%,-50%) scale(0.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}`;

function initForm(){
  const f=$('empFecha'); f.value=today();f.max=today();
  tipoDia='normal';
  renderMarcajeCard();

  // Notificación flotante de cierre de mes
  const hoy=new Date();
  const ultimoDia=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate();
  const diasRestantes=ultimoDia-hoy.getDate();
  if(diasRestantes<=3){
    setTimeout(()=>mostrarCierreMes(diasRestantes), 800);
  }

  // Resumen mes anterior — primeros 3 días del mes
  if(hoy.getDate()<=3){
    setTimeout(()=>mostrarResumenMesAnterior(), 1500);
  }
  document.querySelectorAll('.tipo-btn').forEach(b=>{b.classList.remove('active');b.style.display='';});
  const firstBtn=document.querySelector('.tipo-btn'); if(firstBtn) firstBtn.classList.add('active');
  show('tipoDiaGrid'); show('camposNormal'); hide('camposEspecial');
  hide('camposVacaciones'); hide('camposOtroEspecial');
  ['empActs','heJust','empNota','empNotaOtro'].forEach(id=>{ const e=$(id); if(e) e.value=''; });
  ['vacIni','vacFin'].forEach(id=>{ const e=$(id); if(e) e.value=''; });
  const vacRes=$('vacResumen'); if(vacRes) vacRes.textContent='';
  const tv=$('togV'); if(tv) tv.classList.remove('on');
  hide('heBox'); hide('heResumen');
  // Verificar extensión del usuario
  get(ref(db,`users/${me.id}`)).then(snap=>{
    let diasAtras=3;
    if(snap.exists()){
      const u=snap.val();
      const ext=u.extension;
      if(ext&&ext.hasta&&ext.hasta>=today()&&ext.dias>3){
        diasAtras=ext.dias-1; // ext.dias incluye hoy
      }
    }
    f.min=ago(diasAtras);
    window.onFechaChange();
  }).catch(()=>{ f.min=ago(3); window.onFechaChange(); });
}

async function renderMarcajeCard(){
  const cont=$('marcajeCard');
  if(!cont||!me||me.role!=='empleado'){ if(cont) cont.style.display='none'; return; }

  const hoy=today();
  const sede=sedeEfectiva(me,hoy);

  cont.style.display='';
  cont.innerHTML='<div class="card"><div class="spin"></div></div>';

  let marc;
  try{
    marc=await obtenerMarcajeDia(db,{ref,get},me.id,hoy);
  }catch(e){
    cont.innerHTML=`<div class="card" style="border-left:3px solid var(--danger)">
      <div style="font-size:13px;color:var(--danger)">No se pudo cargar el marcaje. Revisa tu conexión o inténtalo de nuevo.</div>
    </div>`;

  }
  const entrada=marc?.entrada, salida=marc?.salida;

  };

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="card-title" style="margin-bottom:0">Marcaje — ${sede.nombre}${sede.temporal?' <span class="badge by" style="font-size:9px">temporal</span>':''}</div>
      </div>
      <div id="marcajeAlert"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          ${entrada
            ?`<div style="background:var(--bluelt);border-radius:10px;padding:12px;text-align:center">
                <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--blue)">${entrada.horaStr||'--:--'}</div>
                <div style="font-size:11px;color:var(--text2);margin:2px 0 4px">Entrada</div>
                ${badge(entrada.estado)}
              </div>`
            :`<button class="btn btn-p" style="width:100%" onclick="marcarAsistenciaUI('entrada')">✓ Marcar entrada</button>`}
        </div>
        <div>
          ${salida
            ?`<div style="background:var(--bluelt);border-radius:10px;padding:12px;text-align:center">
                <div style="font-family:var(--mono);font-size:18px;font-weight:700;color:var(--blue)">${salida.horaStr||'--:--'}</div>
                <div style="font-size:11px;color:var(--text2);margin:2px 0 4px">Salida</div>

              :`<button class="btn btn-gh" style="width:100%" disabled>Marca entrada primero</button>`}
        </div>
      </div>
    </div>`;
}

window.onFechaChange = async function(){
  const f=$('empFecha');
  if(!f||!f.value) return;
  $('empFechaLbl').textContent=fmtLong(f.value);
  const empAlert=$('empAlert');

  // Verificar cierre de mes primero
  if(mesCerrado(f.value)){
    hide('camposNormal');hide('camposEspecial');hide('heResumen');hide('heBox');hide('tipoDiaGrid');
    if(empAlert) empAlert.innerHTML=`
      <div style="background:var(--gray100);border:1px solid var(--gray300);border-radius:var(--r);padding:16px;text-align:center">
        <div style="font-size:22px;margin-bottom:6px">🔒</div>
        <div style="font-weight:700;font-size:15px;color:var(--text);margin-bottom:6px">Mes cerrado</div>
        <div style="font-size:13px;color:var(--text2)">Este mes ya fue procesado. No puedes agregar ni modificar registros.</div>
      </div>`;
    return;
  }

  // 1. Suspensión — bloqueo total
  const susp=await esSuspension(me.id, f.value);
  if(susp){
    hide('camposNormal');hide('camposEspecial');hide('heResumen');hide('heBox');hide('tipoDiaGrid');
    if(empAlert) empAlert.innerHTML=`
      <div style="background:var(--dangerlt);border:1px solid #fca5a5;border-radius:var(--r);padding:16px;text-align:center">
        <div style="font-size:22px;margin-bottom:6px">🚫</div>
        <div style="font-weight:700;font-size:15px;color:var(--danger);margin-bottom:6px">Día suspendido</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:8px">Este día no será remunerado por suspensión.</div>
        <div style="font-size:13px;color:var(--text);background:#fff;border-radius:6px;padding:8px 12px"><b>Motivo:</b> ${susp.motivo}</div>
      </div>`;
    return;
  }

  // 1b. Vacaciones aprobadas — bloqueo
  try{
    const vacSnap=await get(ref(db,`registros/${me.id}`));
    if(vacSnap.exists()){
      const regs=Object.values(vacSnap.val());
      const vacAprobada=regs.find(r=>r.tipoDia==='vacaciones'&&r.estadoEspecial==='aprobado'&&r.vacIni&&r.vacFin&&f.value>=r.vacIni&&f.value<=r.vacFin);
      if(vacAprobada){
        hide('camposNormal');hide('camposEspecial');hide('heResumen');hide('heBox');hide('tipoDiaGrid');
        if(empAlert) empAlert.innerHTML=`
          <div style="background:var(--greenlt);border:1px solid #6ee7b7;border-radius:var(--r);padding:16px;text-align:center">
            <div style="font-weight:700;font-size:15px;color:var(--green);margin-bottom:6px">Vacaciones aprobadas</div>
            <div style="font-size:13px;color:var(--text2)">Del ${fmt(vacAprobada.vacIni)} al ${fmt(vacAprobada.vacFin)}. No necesitas registrar nada.</div>
          </div>`;
        return;
      }
    }
  }catch(e){}

  // 2. Asueto
  const asueto=await esAsueto(f.value);
  if(asueto){
    tipoDia='asueto';
    hide('camposNormal');hide('heResumen');hide('heBox');hide('camposEspecial');hide('tipoDiaGrid');
    if(empAlert) empAlert.innerHTML=`
      <div style="background:var(--bluelt);border:1px solid var(--bluemid);border-radius:var(--r);padding:16px;text-align:center">
        <div style="font-weight:700;font-size:15px;margin-bottom:4px">${asueto.nombre}</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:14px">Este día es asueto. Si no trabajaste, no necesitas registrar nada.</div>
        <button class="btn btn-gh" onclick="trabajeEnAsueto('${asueto.nombre}')">Trabajé este día →</button>
      </div>`;
    return;
  }

  // 3. Día normal
  if(empAlert) empAlert.innerHTML='';
  show('tipoDiaGrid');
  if(tipoDia==='asueto'){
    tipoDia='normal';
    document.querySelectorAll('.tipo-btn').forEach(b=>{b.classList.remove('active');b.style.display='';});
    const firstBtn=document.querySelector('.tipo-btn'); if(firstBtn) firstBtn.classList.add('active');
    show('camposNormal');hide('camposEspecial');
  }
  const base=horarioBase(f.value);
  const d=new Date(f.value+'T12:00:00'), dow=d.getDay();
  const entrada=$('empEntrada'), salida=$('empSalida');
  if(entrada&&salida){
    if(dow===0||dow===6){ entrada.value='06:00'; salida.value='14:00'; }
    else{ entrada.value=base?.ini||'07:00'; salida.value=base?.fin||(dow===5?'16:00':'17:00'); }
  }
  calcHE();
};

window.calcHE = async function(){
  const fecha=$('empFecha')?.value;
  const entrada=$('empEntrada')?.value;
  const salida=$('empSalida')?.value;
  const resEl=$('heResumen');
  const heBox=$('heBox');
  if(!fecha||!entrada||!salida){ hide('heResumen'); hide('heBox'); return; }

  // Si es asueto, todo es HE — ignorar horario base
  const asueto=await esAsueto(fecha);
  const r = asueto
    ? { he:true, minHE: toMins(salida)-toMins(entrada), heIni:entrada, heFin:salida, esFinde:true }
    : calcularHE(fecha, entrada, salida);

  const d = new Date(fecha+'T12:00:00');
  const dow = d.getDay();
  const diasNombre = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  if(r.he && r.minHE > 0){
    const hrs=Math.floor(r.minHE/60), mins=r.minHE%60;
    const tiempoStr=(hrs>0?hrs+'h ':'')+mins+'m';
    const motivo = asueto
      ? `Día de asueto (${asueto.nombre}) — toda la jornada cuenta como HE`
      : r.esFinde
        ? `${diasNombre[dow]} — jornada completa cuenta como horas extras`
        : `Fuera del horario base (${horarioBase(fecha)?.ini}–${horarioBase(fecha)?.fin})`;
    resEl.innerHTML=`<div style="background:var(--warnlt);border:1px solid #fcd34d;border-radius:var(--r);padding:12px 14px;font-size:13px">
      <div style="font-weight:600;color:var(--warn);margin-bottom:4px">Se detectaron ${tiempoStr} de horas extras</div>
      <div style="color:var(--text2)">${motivo}</div>
    </div>`;
    show('heResumen'); show('heBox');
  } else {
    resEl.innerHTML=`<div style="background:var(--greenlt);border:1px solid #6ee7b7;border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--green)">
      ✓ Dentro del horario laboral — sin horas extras
    </div>`;
    show('heResumen'); hide('heBox');
  }
};

window.guardarReg=async()=>{
  const al=$('empAlert');al.innerHTML='';
  const btnGuardar=document.querySelector('#empReg .btn-p');
  if(btnGuardar){ btnGuardar.disabled=true; btnGuardar.textContent='Guardando...'; }
  const restoreBtn=()=>{ if(btnGuardar){ btnGuardar.disabled=false; btnGuardar.textContent='Guardar registro'; } };
  const fecha=$('empFecha').value;
  if(!fecha){al.innerHTML='<div class="alert ae">Selecciona una fecha.</div>';return;}

  // Verificar cierre de mes
  if(mesCerrado(fecha)){
    al.innerHTML='<div class="alert ae">🔒 Este mes ya está cerrado. No se pueden agregar ni modificar registros.</div>';
    restoreBtn();return;
  }

  // ── VALIDACIÓN DE FECHA EN EL SERVIDOR ──────────────
  // Verificar que la fecha no sea futura (excepto vacaciones)
  if(tipoDia!=='vacaciones' && fecha>today()){
    al.innerHTML='<div class="alert ae">No puedes registrar fechas futuras.</div>';restoreBtn();return;
  }
  // Verificar rango permitido — consultar extensión real desde Firebase
  if(tipoDia==='normal'||tipoDia==='incapacidad'||tipoDia==='permiso'){
    try{
      const snap=await get(ref(db,`users/${me.id}`));
      let diasPermitidos=3;
      if(snap.exists()){
        const u=snap.val();
        if(u.extension&&u.extension.hasta&&u.extension.hasta>=today()&&u.extension.dias>4){
          diasPermitidos=u.extension.dias-1;
        }
      }
      const minFecha=ago(diasPermitidos);
      if(fecha<minFecha){
        al.innerHTML=`<div class="alert ae">Solo puedes registrar hasta ${diasPermitidos} días atrás. Esta fecha no está permitida.</div>`;restoreBtn();return;
      }
    }catch(e){}
  }

  // Check duplicado
  try {
    const snap=await get(ref(db,`registros/${me.id}`));
    if(snap.exists()){
      const dup=Object.values(snap.val()).some(x=>x&&x.fecha===fecha);
      if(dup){al.innerHTML='<div class="alert ae">Ya existe un registro para esta fecha.</div>';restoreBtn();return;}
    }
  } catch(e){al.innerHTML=`<div class="alert ae">Error: ${e.message}</div>`;restoreBtn();return;}

  let datos = { fecha, creadoEn:Date.now(), userId:me.id, userName:me.nombre, cargo:me.cargo||'', tipoDia };

  if(tipoDia==='normal'){
    const entrada=$('empEntrada').value;
    const salida=$('empSalida').value;
    const acts=$('empActs').value.trim();
    const viat=$('togV').classList.contains('on');
    if(!entrada||!salida||!acts){al.innerHTML='<div class="alert ae">Completa horario y actividades.</div>';restoreBtn();return;}
    if(toMins(salida)<=toMins(entrada)){al.innerHTML='<div class="alert ae">Hora de salida debe ser mayor a la entrada.</div>';restoreBtn();return;}
    const asuetoDia=await esAsueto(fecha);
    const r = asuetoDia
      ? { he:true, minHE:toMins(salida)-toMins(entrada), heIni:entrada, heFin:salida }
      : calcularHE(fecha,entrada,salida);
    if(r.he&&!$('heJust')?.value.trim()){al.innerHTML='<div class="alert ae">Escribe la justificación para las horas extras.</div>';restoreBtn();return;}
    datos={...datos, actividades:acts, viatico:viat, horaEntrada:entrada, horaSalida:salida,
      he:r.he, minHE:r.minHE, heInicio:r.heIni, heFin:r.heFin,
      heJustif:r.he?($('heJust')?.value.trim()||''):'',
      estadoViatico:viat?'aprobado':'na',
      estadoHE:r.he?'pendiente':'na'};
  } else {
    // Día especial
    let nota='', vacIni='', vacFin='';
    if(tipoDia==='vacaciones'){
      vacIni=$('vacIni')?.value; vacFin=$('vacFin')?.value;
      nota=$('empNota')?.value.trim()||'';
      if(!vacIni||!vacFin){al.innerHTML='<div class="alert ae">Selecciona fecha inicio y fin de vacaciones.</div>';restoreBtn();return;}
      if(vacFin<vacIni){al.innerHTML='<div class="alert ae">La fecha fin debe ser mayor o igual a inicio.</div>';restoreBtn();return;}
    } else {
      nota=$('empNotaOtro')?.value.trim()||'';
    }
    const necesitaAprobacion=tipoDia==='incapacidad'||tipoDia==='vacaciones'||tipoDia==='permiso';
    datos={...datos,
      actividades:'', viatico:false, he:false, nota,
      ...(tipoDia==='vacaciones'?{vacIni,vacFin}:{}),
      estadoEspecial:necesitaAprobacion?'pendiente':'aprobado',
      estadoViatico:'na', estadoHE:'na'
    };
  }

const timeoutTimer=setTimeout(()=>{
    restoreBtn();
    const alEl=$('empAlert');
    if(alEl) alEl.innerHTML='<div class="alert ae">📶 Tu señal no es buena, intenta de nuevo.</div>';
  }, 12000);

  try {
    await push(ref(db,`registros/${me.id}`), datos);
    clearTimeout(timeoutTimer);
    restoreBtn();
    initForm();
    setTimeout(()=>{
      const alEl=$('empAlert');
      if(alEl){
        alEl.innerHTML='<div class="alert as">✓ Registro guardado correctamente</div>';
        window.scrollTo({top:0,behavior:'smooth'});
        setTimeout(()=>{ if(alEl) alEl.innerHTML=''; }, 4000);
      }
    }, 600);
  } catch(e){
    clearTimeout(timeoutTimer);
    restoreBtn();
    al.innerHTML=`<div class="alert ae">Error al guardar: ${e.message}</div>`;
  }
};

window.cambiarPin=async()=>{
  const al=$('perfilAlert'); al.innerHTML='';
  const actual=$('pinActual').value.trim();
  const nuevo=$('pinNuevo').value.trim();
  const conf=$('pinConfirm').value.trim();
  if(!actual||!nuevo||!conf){al.innerHTML='<div class="alert ae">Completa todos los campos.</div>';return;}
  if(!(await verifyPIN(actual,me.pin))){al.innerHTML='<div class="alert ae">El PIN actual es incorrecto.</div>';return;}
  if(nuevo.length<4){al.innerHTML='<div class="alert ae">PIN nuevo mínimo 4 dígitos.</div>';return;}
  if(nuevo!==conf){al.innerHTML='<div class="alert ae">Los PINs nuevos no coinciden.</div>';return;}
  if(nuevo===actual){al.innerHTML='<div class="alert ae">El PIN nuevo debe ser diferente al actual.</div>';return;}

};

async function loadHist(){
  const l=$('empHistList');l.innerHTML='<div class="spin"></div>';
  const res=$('empResumenMes');res.innerHTML='';
  const snap=await get(ref(db,`registros/${me.id}`));
  if(!snap.exists()){l.innerHTML='<div class="empty"><div class="ei"></div><div class="et">No tienes registros aún</div></div>';return;}
  const raw=snap.val();
  const allItems=Object.entries(raw).map(([k,v])=>({key:k,...v}));
  allItems.sort((a,b)=>b.fecha.localeCompare(a.fecha));

  // Mes seleccionado — por defecto el actual
  const now=new Date();
  const mesActual=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // Selector de mes
  const mesesDisp=[...new Set(allItems.map(r=>r.fecha?.substring(0,7)).filter(Boolean))].sort().reverse();
  let mesSelec=mesActual;
  if(!mesesDisp.includes(mesSelec)&&mesesDisp.length>0) mesSelec=mesesDisp[0];

  let mesEnVista=mesSelec;

  async function renderHist(mes){
    mesEnVista=mes;
    const items=allItems.filter(r=>r.fecha&&r.fecha.startsWith(mes));
    const viaticos=items.filter(r=>r.viatico&&r.estadoViatico!=='rechazado').length;
    const totalMinHE=items.filter(r=>r.he&&r.estadoHE==='aprobado').reduce((acc,r)=>acc+(r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0)),0);
    const hrsHE=Math.floor(totalMinHE/60), minsHE=totalMinHE%60;
    const [anio,mesN]=mes.split('-');
    const nomMesRaw=new Date(parseInt(anio),parseInt(mesN)-1,1).toLocaleDateString('es-SV',{month:'long',year:'numeric'});
    const nomMes=nomMesRaw.charAt(0).toUpperCase()+nomMesRaw.slice(1);

    // Marcajes del mes, indexados por fecha
    let marcajesPorFecha={};
    try{
      const marcs=await obtenerMarcajesMes(db,{ref,get},me.id,mes);
      marcajesPorFecha=Object.fromEntries(marcs.map(m=>[m.fecha,m]));
    }catch(e){}
    res.innerHTML=`
      <div class="hist-summary">
        <div class="hist-summary-hd">
          <button class="hist-nav" onclick="mesAdyacente(-1)" ${mesesDisp.indexOf(mes)>=mesesDisp.length-1?'disabled':''} aria-label="Mes anterior">‹</button>
          <button class="hist-summary-mes" onclick="toggleMesPicker()">${nomMes}</button>
          <button class="hist-nav" onclick="mesAdyacente(1)" ${mesesDisp.indexOf(mes)<=0?'disabled':''} aria-label="Mes siguiente">›</button>
        </div>
        <div class="hist-mes-picker" id="histMesPicker" style="display:none">
          ${mesesDisp.map(m=>{
            const [my,mm]=m.split('-');
            const abrev=new Date(parseInt(my),parseInt(mm)-1,1).toLocaleDateString('es-SV',{month:'short',year:'2-digit'});
            return `<button class="hist-mes-chip ${m===mes?'active':''}" onclick="renderHistMes('${m}')">${abrev}</button>`;
          }).join('')}
        </div>
        <div class="hist-stats">
          <div class="hist-stat"><span class="hist-stat-val">${items.length}</span><span class="hist-stat-lbl">Registros</span></div>
          <div class="hist-stat-div"></div>
          <div class="hist-stat"><span class="hist-stat-val" style="color:var(--green)">${viaticos}</span><span class="hist-stat-lbl">Viáticos</span></div>
          <div class="hist-stat-div"></div>
          <div class="hist-stat"><span class="hist-stat-val" style="color:var(--blue)">${totalMinHE>0?(hrsHE>0?hrsHE+'h ':'')+minsHE+'m':'0'}</span><span class="hist-stat-lbl">Horas extra</span></div>
        </div>
      </div>`;

    if(!items.length){
      l.innerHTML='<div class="empty"><div class="ei"></div><div class="et">Sin registros en este mes</div></div>';
      return;
    }

    const tipoLabels={asueto:'Asueto',vacaciones:'Vacaciones',incapacidad:'Incapacidad',permiso:'Permiso'};
    l.innerHTML=items.map(r=>{
      const esEspecial=r.tipoDia&&r.tipoDia!=='normal';
      if(esEspecial){
        const label=tipoLabels[r.tipoDia]||r.tipoDia;
        const est=r.estadoEspecial||'aprobado';
        const estBadge=est==='pendiente'?'<span class="badge bp">Pendiente</span>':est==='rechazado'?'<span class="badge br">Rechazado</span>':'<span class="badge ba">Aprobado</span>';
        const remBadge=(r.tipoDia==='permiso'&&est==='aprobado')?(r.remunerado===false?'<span class="badge br" style="font-size:10px">No remunerado</span>':'<span class="badge ba" style="font-size:10px">Remunerado</span>'):'';
        return `<div class="rc" onclick="openDet('${me.id}','${r.key}',false)">
          <div class="rc-hd"><div class="rc-date">${fmt(r.fecha)}</div>
          <div class="rc-badges"><span class="badge by">${label}</span>${estBadge}${remBadge}</div></div>
          <div class="rc-desc">${r.nota||'Sin nota'}</div>
        </div>`;
      }
      const ev=r.estadoViatico||(r.viatico?'aprobado':'na');
      const eh=r.estadoHE||(r.he?'pendiente':'na');
      const viatBadge=r.viatico?(ev==='rechazado'?'<span class="badge br">Anulado</span>':'<span class="badge ba">Viático</span>'):'';
      const heBadge=r.he?(eh==='aprobado'?'<span class="badge ba">HE ✓</span>':eh==='rechazado'?'<span class="badge br">HE ✗</span>':'<span class="badge bp">HE pendiente</span>'):'';
      const horario=r.horaEntrada&&r.horaSalida?`<div class="rc-horario">${r.horaEntrada}–${r.horaSalida}</div>`:'';
      const minAprobados=r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0);
      const ajusteInfo=r.heAjustada&&r.notaAjusteHE?`<div style="font-size:11px;color:var(--warn);margin-top:6px">⚠ HE ajustada a ${Math.floor(minAprobados/60)>0?Math.floor(minAprobados/60)+'h ':''+(minAprobados%60)+'m'} — ${r.notaAjusteHE}</div>`:'';
      const marc=marcajesPorFecha[r.fecha];
      const marcItem=(label,dato)=>{
        if(!dato) return `<div class="rc-marcaje-item"><span class="rc-marcaje-lbl">${label}</span><span class="rc-marcaje-val">—</span></div>`;
        const info=ESTADO_LABELS[dato.estado]||{};
        return `<div class="rc-marcaje-item"><span class="rc-marcaje-lbl">${label}</span><span class="rc-marcaje-val">${dato.horaStr}</span>${info.texto&&info.texto!=='—'?`<span class="badge ${info.color||'bn'}" style="font-size:9px">${info.texto}</span>`:''}</div>`;
      };
      const marcajeInfo=marc?`<div class="rc-marcaje">${marcItem('Entrada',marc.entrada)}${marcItem('Salida',marc.salida)}</div>`:'';
      return `<div class="rc" onclick="openDet('${me.id}','${r.key}',false)">
        <div class="rc-hd">
          <div><div class="rc-date">${fmt(r.fecha)}</div>${horario}</div>
          <div class="rc-badges">${viatBadge}${heBadge}</div>
        </div>
        <div class="rc-desc">${r.actividades}</div>
        ${ajusteInfo}
        ${marcajeInfo}
      </div>`;
    }).join('');
  }

  window.renderHistMes=function(mes){ const p=$('histMesPicker'); if(p) p.style.display='none'; renderHist(mes); };
  window.mesAdyacente=function(delta){
    // delta=-1 → mes anterior (más viejo); delta=+1 → mes siguiente (más reciente)
    const idx=mesesDisp.indexOf(mesEnVista);
    const nuevoIdx=idx-delta;
    if(nuevoIdx<0||nuevoIdx>=mesesDisp.length) return;
    renderHist(mesesDisp[nuevoIdx]);
  };
  window.toggleMesPicker=function(){
    const p=$('histMesPicker');
    if(p) p.style.display=(p.style.display==='none'||!p.style.display)?'flex':'none';
  };
  await renderHist(mesSelec);
}

async function getAllRegs(){
  const snap=await get(ref(db,'registros'));
  const a=[];
  if(!snap.exists()) return a;
  const raw=snap.val();
  for(const [uid,regs] of Object.entries(raw)){
    if(regs && typeof regs==='object'){
      for(const [k,v] of Object.entries(regs)){
        if(v && typeof v==='object') a.push({key:k,userId:uid,...v});
      }
    }
  }
  return a;
}
async function getUsers(){
  const snap=await get(ref(db,'users'));
  const a=[];
  if(!snap.exists()) return a;
  const raw=snap.val();
  for(const [k,v] of Object.entries(raw)){
    if(v && typeof v==='object') a.push({id:k,...v});
  }
  return a;
}

// ── AUTO-REGISTRO ASUETOS Y VACACIONES ────────────────
async function autoRegistrarDiasEspeciales(regs, users){
  try{
    const hoy=today();
    const emps=users.filter(u=>u.role!=='admin'&&u.role!=='asistente'&&(u.activo===true||u.activo==='true'));

    // Solo asuetos desde el inicio de la app (abril 2026) hasta hoy
    const fechaInicioApp='2026-04-01';
    const anioActual=new Date().getFullYear();
    const asuetos=(await getAllAsuetos(anioActual)).filter(a=>a.fecha>=fechaInicioApp&&a.fecha<=hoy);

    // Limpiar asuetos auto-generados anteriores a la fecha de inicio
    const borrar=regs.filter(r=>r.autoGenerado&&r.tipoDia==='asueto'&&r.fecha&&r.fecha<fechaInicioApp);
    if(borrar.length>0){
      await Promise.all(borrar.map(r=>set(ref(db,`registros/${r.userId}/${r.key}`),null)));
    }

    // 2. Vacaciones aprobadas
    const vacAprobadas=regs.filter(r=>
      r.tipoDia==='vacaciones'&&
      r.estadoEspecial==='aprobado'&&
      r.vacIni&&r.vacFin
    );

    // Índice de registros existentes por userId+fecha
    const existe=new Set(regs.map(r=>`${r.userId}_${r.fecha}`));

    const promesas=[];

    for(const emp of emps){
      // Registrar asuetos
      for(const a of asuetos){
        const key=`${emp.id}_${a.fecha}`;
        if(!existe.has(key)){
          existe.add(key); // evitar duplicados en el mismo ciclo
          promesas.push(push(ref(db,`registros/${emp.id}`),{
            fecha:a.fecha,
            tipoDia:'asueto',
            actividades:'',
            viatico:false, he:false,
            estadoViatico:'na', estadoHE:'na',
            estadoEspecial:'aprobado',
            nota:a.nombre,
            userId:emp.id, userName:emp.nombre, cargo:emp.cargo||'',
            creadoEn:Date.now(), autoGenerado:true
          }));
        }
      }

      // Registrar días de vacaciones aprobadas de este empleado
      const misVac=vacAprobadas.filter(v=>v.userId===emp.id);
      for(const v of misVac){
        // Generar cada día del rango
        const ini=new Date(v.vacIni+'T12:00:00');
        const fin=new Date(v.vacFin+'T12:00:00');
        for(let d=new Date(ini);d<=fin;d.setDate(d.getDate()+1)){
          const fecha=d.toISOString().split('T')[0];
          if(fecha>hoy) continue; // solo días ya pasados o hoy
          const key=`${emp.id}_${fecha}`;
          if(!existe.has(key)){
            existe.add(key);
            promesas.push(push(ref(db,`registros/${emp.id}`),{
              fecha,
              tipoDia:'vacaciones',
              actividades:'',
              viatico:false, he:false,
              estadoViatico:'na', estadoHE:'na',
              estadoEspecial:'aprobado',
              nota:'Vacaciones aprobadas',
              userId:emp.id, userName:emp.nombre, cargo:emp.cargo||'',
              creadoEn:Date.now(), autoGenerado:true
            }));
          }
        }
      }
    }

    if(promesas.length>0) await Promise.all(promesas);
  }catch(e){ console.error('autoRegistrar error:',e); }
}

  $('dashDate').textContent=new Date().toLocaleDateString('es-SV',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

      </tr>`;
    }).join('')}</tbody></table></div>`;
  const sin=emps.filter(u=>!conHoy.has(u.id));
  $('dashSin').innerHTML=sin.length===0

  try{

    const cardAsist=$('dashAsistCard');

      cardAsist.style.display='';

async function loadPend(){
  const l=$('pendList');l.innerHTML='<div class="spin"></div>';
  let all=await getAllRegs();
  // Asistente solo ve registros de sus empleados asignados
  if(!isAdmin()&&me.empleadosAsig&&me.empleadosAsig.length>0){
    all=all.filter(r=>me.empleadosAsig.includes(r.userId));
  }
  const tipoLabels={asueto:'Asueto',vacaciones:'Vacaciones',incapacidad:'Incapacidad',permiso:'Permiso'};
  // HE pendientes + días especiales pendientes (solo incapacidad y vacaciones)
  const pendHE=all.filter(r=>r.he&&r.estadoHE==='pendiente');
  const pendEsp=all.filter(r=>r.tipoDia&&r.tipoDia!=='normal'&&r.tipoDia!=='asueto'&&r.estadoEspecial==='pendiente');  const pend=[...pendHE,...pendEsp].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!pend.length){l.innerHTML='<div class="empty"><div class="ei">✅</div><div class="et">Sin pendientes</div></div>';return;}
  l.innerHTML=pend.map(r=>{
    const esEspecial=r.tipoDia&&r.tipoDia!=='normal';
    if(esEspecial){
      const label=tipoLabels[r.tipoDia]||r.tipoDia;
      return `<div class="card" style="border-left:4px solid var(--warn)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <div><div style="font-weight:700;font-size:15px">${r.userName||r.userId}</div><div style="font-size:12px;color:var(--text2)">${fmtLong(r.fecha)}</div></div>
          <span class="badge by">${label}</span>
        </div>
        ${r.tipoDia==='vacaciones'&&r.vacIni&&r.vacFin?`<div style="font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px">Del ${fmt(r.vacIni)} al ${fmt(r.vacFin)} · ${Math.round((new Date(r.vacFin+'T12:00:00')-new Date(r.vacIni+'T12:00:00'))/(1000*60*60*24))+1} días</div>`:''}
        ${r.nota?`<div style="font-size:13px;color:var(--text2);margin-bottom:12px">${r.nota}</div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${isAdmin()?`<button class="btn btn-g btn-sm" onclick="${
            r.tipoDia==='permiso'?`abrirAprobarPermiso('${r.userId}','${r.key}','${r.userName||''}','${r.fecha}')`:
            r.tipoDia==='vacaciones'?`aprobarVacacionesPend('${r.userId}','${r.key}')`:
            `aprobarEspecialPend('${r.userId}','${r.key}')`}">✓ Aprobar</button>
          <button class="btn btn-gh btn-sm" onclick="openRejEspecial('${r.userId}','${r.key}');rejCallback=loadPend">Rechazar</button>`:''}
          <button class="btn btn-gh btn-sm" onclick="openObs('${r.userId}','${r.key}','${r.userName||''}','${r.fecha}')">Observación</button>
        </div>
      </div>`;
    }
    return `<div class="card" style="border-left:4px solid var(--warn)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:10px">
        <div><div style="font-weight:700;font-size:15px">${r.userName||r.userId}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${fmtLong(r.fecha)}</div></div>
        <span class="badge bp">HE — ${r.heInicio||''}–${r.heFin||''}</span>
      </div>
      <div style="font-size:12px;background:var(--bluelt);padding:9px 12px;border-radius:7px;margin-bottom:12px;color:var(--blue)"><b>Justif. HE:</b> ${r.heJustif}</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5">${r.actividades}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${isAdmin()?`<button class="btn btn-g btn-sm" onclick="aprobarHE('${r.userId}','${r.key}')">✓ Aprobar HE</button>
        <button class="btn btn-d btn-sm" onclick="openRej('${r.userId}','${r.key}','he')">✗ Rechazar HE</button>`:''}
        <button class="btn btn-gh btn-sm" onclick="openDet('${r.userId}','${r.key}',true)">Ver detalle</button>
        ${!isAdmin()?`<button class="btn btn-gh btn-sm" onclick="openObs('${r.userId}','${r.key}','${r.userName||''}','${r.fecha}')">Observación</button>`:''}
      </div></div>`;
  }).join('');
}

window.filtrarEmps=()=>{

  const l=$('adEmpList'); if(!l||!empListHTML) return;
  if(!q){ l.innerHTML=empListHTML; return; }
  // Filter rows inside the card
  const tmp=document.createElement('div');
  tmp.innerHTML=empListHTML;
  const rows=tmp.querySelectorAll('[data-nombre]');
  let visible=0;
  rows.forEach(r=>{
    const match=r.dataset.nombre.toLowerCase().includes(q);

};

            <span style="color:var(--warn);font-weight:600">${hrsStr}</span>
          </div>
          <span style="color:var(--gray300);font-size:16px">›</span>

window.cargarPerfilEmpleado=async()=>{
  const l=$('adEmpRegs'); l.innerHTML='<div class="spin"></div>';
  const mes=$('adEmpMes')?.value;
  const snap=await get(ref(db,`registros/${perfilEmpUID}`));

  if(!snap.exists()){
    l.innerHTML='<div class="empty"><div class="ei"></div><div class="et">Sin registros</div></div>';
    $('adEmpResumen').innerHTML=''; return;
  }

  let items=Object.entries(snap.val()).map(([k,v])=>({key:k,...v}));
  if(mes) items=items.filter(r=>r.fecha&&r.fecha.startsWith(mes));
  items.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  filtRegs=items.map(r=>({...r,userId:perfilEmpUID}));

  // Resumen — solo HE aprobadas
  const viaticos=items.filter(r=>r.viatico&&r.estadoViatico!=='rechazado').length;
  const totalMin=items.filter(r=>r.he&&r.estadoHE==='aprobado').reduce((a,r)=>a+(r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0)),0);
  const hrsHE=Math.floor(totalMin/60), minsHE=totalMin%60;
  const pendHE=items.filter(r=>r.he&&r.estadoHE==='pendiente').length;
  $('adEmpResumen').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:4px">
      <div class="stat-card g"><div class="stat-val">${items.length}</div><div class="stat-lbl">Registros</div></div>
      <div class="stat-card"><div class="stat-val">${viaticos}</div><div class="stat-lbl">Viáticos</div></div>
      <div class="stat-card w"><div class="stat-val" style="font-size:20px">${totalMin>0?(hrsHE>0?hrsHE+'h ':'')+minsHE+'m':'0'}</div><div class="stat-lbl">Hrs extras</div></div>
    </div>
    ${pendHE>0?`<div class="alert ae" style="margin-bottom:0">${pendHE} hora${pendHE>1?'s extra pendientes':' extra pendiente'} de aprobación</div>`:''}`;

  if(!items.length){
    l.innerHTML='<div class="empty"><div class="ei"></div><div class="et">Sin registros en este período</div></div>';
    return;
  }

  l.innerHTML=`<div class="card" style="padding:0;overflow:hidden">`+items.map((r,i)=>{
    const ev=r.estadoViatico||(r.viatico?'aprobado':'na');
    const eh=r.estadoHE||(r.he?'pendiente':'na');
    const horario=r.horaEntrada&&r.horaSalida?`${r.horaEntrada} – ${r.horaSalida}`:'—';
    const heMin=r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0);
    const heStr=heMin>0?(Math.floor(heMin/60)>0?Math.floor(heMin/60)+'h ':'')+heMin%60+'m extra':'';
    const border=i>0?'border-top:1px solid var(--gray100);':'';
    const pendiente=r.he&&eh==='pendiente';
    const esEspecial=r.tipoDia&&r.tipoDia!=='normal';
    const tipoLabels={asueto:'Asueto',vacaciones:'Vacaciones',incapacidad:'Incapacidad',permiso:'Permiso'};
    const pendEspecial=esEspecial&&r.estadoEspecial==='pendiente';

    if(esEspecial){
      const label=tipoLabels[r.tipoDia]||r.tipoDia;
      const est=r.estadoEspecial||'aprobado';
      const remBadge=(r.tipoDia==='permiso'&&est==='aprobado')
        ?(r.remunerado===false?'<span class="badge br" style="font-size:10px">No remunerado</span>':'<span class="badge ba" style="font-size:10px">Remunerado</span>'):'';
      const rangoVac=(r.tipoDia==='vacaciones'&&r.vacIni&&r.vacFin)
        ?`<div style="font-size:13px;font-weight:600;color:var(--blue);margin-bottom:6px">Del ${fmt(r.vacIni)} al ${fmt(r.vacFin)} · ${Math.round((new Date(r.vacFin+'T12:00:00')-new Date(r.vacIni+'T12:00:00'))/(1000*60*60*24))+1} días</div>`:'';
      return `<div style="${border}padding:16px;border-left:3px solid ${pendEspecial?'var(--warn)':est==='aprobado'?'var(--green)':'var(--danger)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${rangoVac||r.nota||pendEspecial?'8px':'0'}">
          <div><div style="font-weight:700;font-size:14px">${fmt(r.fecha)}</div></div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <span class="badge by">${label}</span>
            <span class="badge ${est==='pendiente'?'bp':est==='aprobado'?'ba':'br'}">${est==='pendiente'?'Pendiente':est==='aprobado'?'Aprobado':'Rechazado'}</span>
            ${remBadge}
          </div>

window.cambiarPinAdmin=async()=>{

  const conf=$('adPinConfirm').value.trim();

window.confirmarAprobarHE=async()=>{
  if(!heAprobKey) return;
  const horas=parseInt($('heAprobHoras').value)||0;
  const mins=parseInt($('heAprobMins').value)||0;
  const nota=$('heAprobNota').value.trim();
  const minAprobados=(horas*60)+mins;

  // Cargar minHE original para comparar
  const snap=await get(ref(db,`registros/${heAprobKey.uid}/${heAprobKey.key}`));
  const original=snap.exists()?(snap.val().minHE||0):0;
  const modificado=minAprobados!==original;

  if(modificado&&!nota){
    alert('Agrega una nota explicando por qué modificaste las horas.');
    return;
  }

  await update(ref(db,`registros/${heAprobKey.uid}/${heAprobKey.key}`),{
    estadoHE:'aprobado',
    revisadoHEEn:Date.now(),
    minHEAprobado:minAprobados,
    ...(modificado?{notaAjusteHE:nota,heAjustada:true}:{})
  });
  closeModal('moAprobarHE');
  if(heAprobCallback) await heAprobCallback();
};

    emps=emps.filter(u=>me.empleadosAsig.includes(u.id));
  }
  emps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const [y,m]=mes.split('-');
  const nomMes=new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('es-SV',{month:'long',year:'numeric'});

        </div>
        <div style="background:var(--greenlt);border-radius:8px;padding:12px">
          <div style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green)">${totViat}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:3px">Viáticos</div>
        </div>
        <div style="background:var(--warnlt);border-radius:8px;padding:12px">
          <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--warn)">${totMinHE>0?(totHrs>0?totHrs+'h ':'')+totMins+'m':'0'}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:3px">Hrs extras</div>
        </div>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      ${filas.map((f,i)=>`
        <div style="${i>0?'border-top:1px solid var(--gray100);':''}padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer"
          onclick="abrirPerfilEmp('${f.u.id}','${f.u.nombre}','${mes}')"
          onmouseover="this.style.background='var(--bluelt)'" onmouseout="this.style.background=''">
          <div style="min-width:0;flex:1">
            <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.u.nombre}</div>

              <span style="color:var(--text);font-weight:600">${f.regs}</span> reg &nbsp;

  // Hoja resumen
  const rHeaders=['Empleado','Cargo','Registros','Viáticos','Días HE aprobados','Total HE'];

    return [u.nombre,u.cargo||'',re.length,v,heD,min>0?(h>0?h+'h ':'')+m+'m':'—'];
  });
  const totV=rRows.reduce((a,r)=>a+r[3],0);
  const totD=rRows.reduce((a,r)=>a+r[4],0);
  const totMin=regsDelMes.filter(r=>r.he&&r.estadoHE==='aprobado').reduce((a,r)=>a+(r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0)),0);
  const tH=Math.floor(totMin/60),tM=totMin%60;
  const ws2=XLSX.utils.aoa_to_sheet([rHeaders,...rRows,[],['TOTAL GENERAL','',rRows.reduce((a,r)=>a+r[2],0),totV,totD,totMin>0?(tH>0?tH+'h ':'')+tM+'m':'0']]);
  ws2['!cols']=[{wch:30},{wch:28},{wch:12},{wch:10},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'Resumen');
  const [y,m]=mes.split('-');
  const nomMes=new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('es-SV',{month:'long',year:'numeric'});
  XLSX.writeFile(wb,`planilla-${nomMes.replace(' ','-')}.xlsx`);
};

async function loadObservaciones(){

  const items=Object.entries(snap.val()).map(([k,v])=>({...v,obsId:k}))
    .sort((a,b)=>b.creadoEn-a.creadoEn);
  const tipoLabels={viatico:'Viático no corresponde',he:'HE no corresponden',general:'General'};
  l.innerHTML=`<div class="card" style="padding:0;overflow:hidden">`+items.map((o,i)=>{

    return `

        </div>
        <div style="font-size:11px;color:var(--text2);white-space:nowrap">${o.asistente||'—'}</div>
      </div>
      <div style="font-size:13px;color:var(--text);margin-bottom:8px">${o.detalle||'—'}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${o.uid&&o.key?`<button class="btn btn-gh btn-xs" onclick="verRegObs('${o.uid}','${o.key}')">Ver registro</button>`:''}
       ${!o.leida?`<button class="btn btn-gh btn-xs" onclick="marcarLeida('${o.obsId}')">Marcar leída</button>`:'<span style="font-size:11px;color:var(--gray400)">✓ Leída</span>'}

function updateObsBadge(items){
  const badge=$('obsBadge');
  if(!badge) return;
  const noLeidas=items.filter(o=>!o.leida).length;
  if(noLeidas>0){ badge.textContent=noLeidas; badge.style.display='inline'; }
  else badge.style.display='none';
}
window.verRegObs=async(uid,key)=>{
  if(!uid||!key){ alert('Referencia de registro no válida.'); return; }

};
window.marcarLeida=async(key)=>{
  try{
    await set(ref(db,`observaciones/${key}/leida`), true);
    const obsSnap=await get(ref(db,'observaciones'));
    const badge=$('obsBadge');
    const card=$('dashObsCard');
    const listEl=$('dashObsList');
    if(obsSnap.exists()){
      const obsItems=Object.entries(obsSnap.val()).map(([k,v])=>({...v,obsId:k}));
      const noLeidas=obsItems.filter(o=>!o.leida&&o.detalle);
      if(badge){ if(noLeidas.length){badge.textContent=noLeidas.length;badge.style.display='inline';}else badge.style.display='none'; }
      if(card){
        if(noLeidas.length){
          card.style.display='';
          const tipoLabels={viatico:'Viático',he:'HE',general:'General'};
          if(listEl) listEl.innerHTML=noLeidas.slice(0,5).map(o=>`
            <div style="padding:10px 0;border-bottom:1px solid var(--gray100);display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div style="flex:1;min-width:0">
                <span class="badge by" style="font-size:10px">${tipoLabels[o.tipo]||''}</span>
                <span style="font-size:11px;color:var(--text2);margin-left:4px">${o.asistente||''}</span>
                <div style="font-size:13px;color:var(--text);margin-top:3px">${o.detalle}</div>
              </div>
              <button class="btn btn-gh btn-xs" style="flex-shrink:0" onclick="marcarLeida('${o.key}')">✓ Leída</button>
            </div>`).join('')+
            (noLeidas.length>5?`<div style="font-size:12px;color:var(--text2);padding-top:8px">+${noLeidas.length-5} más en la pestaña Observaciones</div>`:'');
        } else card.style.display='none';
      }
    } else {
      if(badge) badge.style.display='none';
      if(card) card.style.display='none';
    }
    if($('adObs')&&$('adObs').style.display!=='none') await loadObservaciones();
  }catch(e){ alert('Error al marcar: '+e.message); }
};

window.exportar=async()=>{
  if(!filtRegs.length){alert('Primero selecciona un empleado y un mes.');return;}

  // Load SheetJS dynamically
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=rej; document.head.appendChild(s);
    });
  }

  const wb=XLSX.utils.book_new();

  // ── Hoja 1: Detalle ──
  const headers=['Fecha','Empleado','Cargo','Entrada','Salida','Actividades',
    'Viático','Estado Viático','Horas Extras','Mins HE','Justificación HE',
    'Estado HE','Motivo Anulación Viático','Motivo Rechazo HE'];

  const rows=filtRegs.map(r=>[
    r.fecha, r.userName||r.userId, r.cargo||'',
    r.horaEntrada||'', r.horaSalida||'', r.actividades,
    r.viatico?'Sí':'No', r.estadoViatico||'—',
    r.he?'Sí':'No', r.estadoHE==='aprobado'?(r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0)):0,
    r.heJustif||'', r.estadoHE||'—',
    r.motivoRechazoViatico||'', r.motivoRechazoHE||''
  ]);

  const ws1=XLSX.utils.aoa_to_sheet([headers,...rows]);
  // Column widths
  ws1['!cols']=[{wch:12},{wch:30},{wch:32},{wch:9},{wch:9},{wch:45},
    {wch:9},{wch:16},{wch:9},{wch:10},{wch:35},{wch:16},{wch:30},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Detalle');

  // ── Hoja 2: Resumen por empleado ──
  const totMap={};
  for(const r of filtRegs){
    const n=r.userName||r.userId;
    if(!totMap[n]) totMap[n]={nombre:n,cargo:r.cargo||'',viaticos:0,heDias:0,minHE:0};
    if(r.viatico&&r.estadoViatico!=='rechazado') totMap[n].viaticos++;
    if(r.he&&r.estadoHE==='aprobado'){
      totMap[n].heDias++;
      totMap[n].minHE+=(r.minHEAprobado!==undefined?r.minHEAprobado:(r.minHE||0));
    }
  }
  const resHeaders=['Empleado','Cargo','Viáticos','Días con HE aprobada','Total horas extras'];
  const resRows=Object.values(totMap).map(t=>{
    const hrs=Math.floor(t.minHE/60), mins=t.minHE%60;
    return [t.nombre, t.cargo, t.viaticos, t.heDias, hrs>0?`${hrs}h ${mins}m`:(mins>0?`${mins}m`:'—')];
  });
  // Fila de totales
  const totalViat=Object.values(totMap).reduce((a,t)=>a+t.viaticos,0);
  const totalHEDias=Object.values(totMap).reduce((a,t)=>a+t.heDias,0);
  const totalMinAll=Object.values(totMap).reduce((a,t)=>a+t.minHE,0);
  const thrs=Math.floor(totalMinAll/60), tmins=totalMinAll%60;
  const totalsRow=['TOTAL GENERAL','',totalViat,totalHEDias,thrs>0?`${thrs}h ${tmins}m`:(tmins>0?`${tmins}m`:'0')];
  const sepRow=['','','','',''];
  const ws2=XLSX.utils.aoa_to_sheet([resHeaders,...resRows,sepRow,totalsRow]);
  ws2['!cols']=[{wch:32},{wch:32},{wch:10},{wch:22},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');

  const nombre=filtRegs[0]?.userName||'empleado';
  XLSX.writeFile(wb, `registro-planilla-${nombre.split(' ')[0]}-${today()}.xlsx`);
};

async function loadUsrs(){
  const l=$('usrList');l.innerHTML='<div class="spin"></div>';

  l.innerHTML=emps.map(u=>{
    const activo=u.activo===true||u.activo==='true';
    const ext=u.extension; // {dias, hasta}
    const extActiva=ext&&ext.hasta&&ext.hasta>=today();
    const st=u.sedeTemporal;
    const sedeTempActiva=st&&st.hasta&&st.hasta>=today();
    const sedeLabel=u.role==='empleado'
      ?(sedeTempActiva?`${NOMBRE_SEDES[st.sede]||st.sede} (temporal)`:(u.sede?NOMBRE_SEDES[u.sede]:'Sin sede'))
      :'';
    return `<div class="ur">
    <div>
      <div class="un">${u.nombre} <span class="badge ${activo?'bac':'bin'}">${activo?'Activo':'Inactivo'}</span>
        ${extActiva?`<span class="badge by" style="font-size:10px">+${ext.dias}d hasta ${fmt(ext.hasta)}</span>`:''}
        ${u.role==='empleado'?`<span class="badge ${sedeTempActiva?'by':'bn'}" style="font-size:10px">${sedeLabel}</span>`:''}
      </div>
      <div class="um">@${u.username}</div>

      ${isAdmin()?`
      <button class="btn btn-gh btn-sm" onclick="openModalUser('${u.id}')">Editar</button>
      <button class="btn btn-gh btn-sm" onclick="openExtension('${u.id}','${u.nombre}')">${extActiva?'Ver extensión':'+ Extensión'}</button>
      ${u.role==='empleado'?`<button class="btn btn-gh btn-sm" onclick="openSedeTemp('${u.id}','${u.nombre}')">${sedeTempActiva?'Ver sede temp.':'Cambiar sede'}</button>`:''}

  $('sedeTempHasta').value=st?.hasta||'';
  $('sedeTempBtnQuitar').style.display=activa?'':'none';
  $('moSedeTemp').classList.add('open');
};
window.guardarSedeTemp=async()=>{
  const sede=$('sedeTempSede').value;
  const hasta=$('sedeTempHasta').value;
  if(!sede||!hasta){alert('Completa los campos.');return;}
  if(hasta<today()){alert('La fecha de vencimiento debe ser hoy o en el futuro.');return;}
  await update(ref(db,`users/${sedeTempUID}`),{sedeTemporal:{sede,hasta}});
  closeModal('moSedeTemp');loadUsrs();
};
window.quitarSedeTemp=async()=>{
  await update(ref(db,`users/${sedeTempUID}`),{sedeTemporal:null});
  closeModal('moSedeTemp');loadUsrs();
};

// ── SOLO PARA PRUEBAS: asignar/quitar sede masivamente ──
window.asignarSedePruebaATodos=async()=>{
  if(!confirm('Esto asignará la sede de prueba a TODOS los empleados. ¿Continuar?')) return;
  const users=await getUsers();
  const emps=users.filter(u=>u.role==='empleado');
  await Promise.all(emps.map(u=>update(ref(db,`users/${u.id}`),{sede:'prueba'})));
  alert(`Sede de prueba asignada a ${emps.length} empleados.`);
  loadUsrs();
};
window.quitarSedeATodos=async()=>{
  if(!confirm('Esto quitará la sede asignada a TODOS los empleados. ¿Continuar?')) return;
  const users=await getUsers();
  const emps=users.filter(u=>u.role==='empleado');
  await Promise.all(emps.map(u=>update(ref(db,`users/${u.id}`),{sede:''})));
  alert(`Sede quitada a ${emps.length} empleados.`);
  loadUsrs();
};
window.onRolChange=async(rol)=>{
  const sec=$('secEmpleadosAsig');
  const secSede=$('secSede');
  if(sec){
    if(rol==='asistente'){ sec.style.display='block'; await cargarListaEmpleadosAsig([]); }
    else sec.style.display='none';
  }
  if(secSede){ secSede.style.display=(rol==='empleado')?'block':'none'; }
};

async function cargarListaEmpleadosAsig(seleccionados=[]){
  const l=$('listaEmpleadosAsig'); if(!l) return;
  const users=await getUsers();
  const emps=users.filter(u=>u.role==='empleado'&&(u.activo===true||u.activo==='true'));
  emps.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  l.innerHTML=emps.map(u=>`
    <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--gray100)">
      <input type="checkbox" value="${u.id}" ${seleccionados.includes(u.id)?'checked':''} style="width:16px;height:16px;accent-color:var(--blue)">
      <span>${u.nombre}</span>
    </label>`).join('');
}

window.openModalUser=async(uid)=>{
  editUID=uid||null;
  $('moUsrTitle').textContent=uid?'Editar usuario':'Nuevo usuario';
  $('moUsrAlert').innerHTML='';
  ['uNom','uUsr','uPin'].forEach(id=>$(id).value='');
  $('uRol').value='empleado';
  $('secEmpleadosAsig').style.display='none';
  if($('uSede')) $('uSede').value='';
  if($('secSede')) $('secSede').style.display='block';
  if(uid){
    const s=await get(ref(db,`users/${uid}`));
    if(s.exists()){
      const u=s.val();
      $('uNom').value=u.nombre;
      $('uUsr').value=u.username;
      $('uRol').value=u.role==='asistente'?'asistente':'empleado';
      if(u.role==='asistente'){
        $('secEmpleadosAsig').style.display='block';
        if($('secSede')) $('secSede').style.display='none';
        await cargarListaEmpleadosAsig(u.empleadosAsig||[]);
      }
      if($('uSede')) $('uSede').value=u.sede||'';
    }
  }
  $('moUsr').classList.add('open');
};

window.saveUser=async()=>{
  const al=$('moUsrAlert');
  const nom=$('uNom').value.trim(),usr=$('uUsr').value.trim().toLowerCase(),pin=$('uPin').value.trim();
  const rol=$('uRol').value||'empleado';
  if(!nom||!usr){al.innerHTML='<div class="alert ae">Nombre y usuario son obligatorios.</div>';return;}
  if(!editUID&&(!pin||pin.length<4)){al.innerHTML='<div class="alert ae">PIN mínimo de 4 dígitos.</div>';return;}
  const users=await getUsers();
  if(users.find(u=>u.username===usr&&u.id!==editUID)){al.innerHTML='<div class="alert ae">Ese usuario ya existe.</div>';return;}
  // Obtener empleados asignados si es asistente
  let empleadosAsig=[];
  if(rol==='asistente'){
    const checks=document.querySelectorAll('#listaEmpleadosAsig input[type=checkbox]:checked');
    empleadosAsig=Array.from(checks).map(c=>c.value);
  }
  const sede=(rol==='empleado'&&$('uSede'))?($('uSede').value||''):'';
  if(editUID){
    const d={nombre:nom,username:usr,role:rol,empleadosAsig:rol==='asistente'?empleadosAsig:[],sede};
    if(pin.length>=4){ d.pin=await savePIN(pin); }
    await update(ref(db,`users/${editUID}`),d);
  } else {
    await set(push(ref(db,'users')),{nombre:nom,username:usr,pin:await savePIN(pin),role:rol,activo:true,empleadosAsig:rol==='asistente'?empleadosAsig:[],sede});
  }
  closeModal('moUsr');loadUsrs();
};

window.closeModal=id=>$(id).classList.remove('open');
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mo.open').forEach(m=>m.classList.remove('open'));});

// Lock scroll on login screen at startup
document.body.style.overflow='hidden';
</script>
</body>
