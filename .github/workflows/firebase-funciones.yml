# Publica las Cloud Functions de Registro de Planilla (carpeta functions/) y las reglas
# de la base (database.rules.json) en Firebase cada vez que cambian en main. También se
# puede correr a mano desde la pestaña Actions ("Run workflow").
#
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# del proyecto daily-e4f86 con rol Propietario). Ver functions/LEEME.md.
name: Publicar funciones de Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'database.rules.json'
      - '.github/workflows/firebase-funciones.yml'
  workflow_dispatch:

concurrency:
  group: firebase-funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: daily-e4f86
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que exista el secreto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver functions/LEEME.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de las funciones
        run: npm ci --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Activar servicios necesarios
        run: |
          gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com \
            iamcredentials.googleapis.com cloudbilling.googleapis.com identitytoolkit.googleapis.com --project "$PROYECTO"

      - name: Publicar funciones
        run: npx --yes firebase-tools@14 deploy --only functions --project "$PROYECTO" --force --non-interactive

      # Permisos de la cuenta con la que corren las funciones: firmar tokens de
      # acceso (login), leer y escribir la base (Realtime Database) y administrar Auth.
      - name: Permisos de las funciones
        run: |
          NUM=$(gcloud projects describe "$PROYECTO" --format='value(projectNumber)')
          SA="$NUM-compute@developer.gserviceaccount.com"
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --member="serviceAccount:$SA" --role="roles/iam.serviceAccountTokenCreator" \
            --project "$PROYECTO" >/dev/null
          for ROL in roles/firebasedatabase.admin roles/firebaseauth.admin; do
            gcloud projects add-iam-policy-binding "$PROYECTO" --member="serviceAccount:$SA" \
              --role="$ROL" --condition=None >/dev/null
          done
          echo "Permisos listos para $SA"

      - name: Probar el login (usuario inventado y login correcto con un usuario temporal)
        run: |
          sleep 45
          node functions/prueba-despliegue.test.js

      - name: Registro de errores del login (si algo falló)
        if: failure()
        run: |
          gcloud functions logs read login --region us-central1 --gen2 --limit 40 --project "$PROYECTO" || true

      # ── Reglas de la base ───────────────────────────────────────────────
      # Antes de cambiarlas se guarda una copia de las que había (se puede bajar
      # del intento en Actions → "reglas-anteriores"); si la prueba de después
      # falla, se vuelven a poner solas.
      - name: Respaldar las reglas actuales de la base
        run: |
          TOKEN=$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email)
          curl -sf "https://$PROYECTO-default-rtdb.firebaseio.com/.settings/rules.json?access_token=$TOKEN" -o reglas-anteriores.json
          echo "Reglas que había:"; cat reglas-anteriores.json

      - uses: actions/upload-artifact@v4
        with:
          name: reglas-anteriores
          path: reglas-anteriores.json

      - name: Publicar las reglas de la base
        run: npx --yes firebase-tools@14 deploy --only database --project "$PROYECTO" --non-interactive

      # Sin sesión: no se puede leer nada salvo lo que necesita la pantalla de login.
      # Se pregunta con la cuenta de servicio pero evaluando las reglas "sin sesión"
      # (auth_variable_override=null): así App Check no se mete en la prueba.
      - name: Probar las reglas (sin sesión no se lee nada)
        id: probar_reglas
        run: |
          sleep 10
          TOKEN=$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email)
          B="https://$PROYECTO-default-rtdb.firebaseio.com"
          Q="access_token=$TOKEN&auth_variable_override=null"
          for RUTA in users registros marcajes pins config/sabadosLaborales; do
            CODIGO=$(curl -s -o r.txt -w '%{http_code}' "$B/$RUTA.json?shallow=true&$Q")
            if [ "$CODIGO" != "401" ]; then echo "::error::$RUTA se puede leer sin sesión (respuesta $CODIGO)"; exit 1; fi
            echo "$RUTA: cerrado"
          done
          for RUTA in config/mantenimiento config/cierreSesion config/tema config/musica; do
            CODIGO=$(curl -s -o r.txt -w '%{http_code}' "$B/$RUTA.json?$Q")
            if [ "$CODIGO" != "200" ]; then echo "::error::$RUTA no se puede leer en el login (respuesta $CODIGO: $(head -c 200 r.txt))"; exit 1; fi
            echo "$RUTA: visible para el login"
          done
          CODIGO=$(curl -s -o r.txt -w '%{http_code}' -X PUT -d 'true' "$B/prueba_sin_sesion.json?$Q")
          if [ "$CODIGO" != "401" ]; then echo "::error::Se pudo escribir sin sesión (respuesta $CODIGO)"; exit 1; fi
          echo "Escribir sin sesión: negado"

      - name: Volver a poner las reglas anteriores (si la prueba falló)
        if: failure() && steps.probar_reglas.outcome == 'failure'
        run: |
          TOKEN=$(gcloud auth print-access-token --scopes=https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email)
          curl -sf -X PUT --data-binary @reglas-anteriores.json "https://$PROYECTO-default-rtdb.firebaseio.com/.settings/rules.json?access_token=$TOKEN"
          echo "Se volvieron a poner las reglas anteriores."
