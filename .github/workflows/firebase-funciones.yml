# Publica las Cloud Functions de Registro de Planilla (carpeta functions/) en Firebase
# cada vez que cambian en main. También se puede correr a mano desde la
# pestaña Actions ("Run workflow").
#
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# del proyecto daily-e4f86 con rol Propietario). Ver functions/LEEME.md.
name: Publicar funciones de Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-funciones.yml'
  workflow_dispatch:

concurrency:
  group: firebase-funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: daily-e4f86
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que exista el secreto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (ver functions/LEEME.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de las funciones
        run: npm ci --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Activar servicios necesarios
        run: |
          gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com \
            iamcredentials.googleapis.com cloudbilling.googleapis.com --project "$PROYECTO"

      - name: Publicar funciones
        run: npx --yes firebase-tools@14 deploy --only functions --project "$PROYECTO" --force --non-interactive

      # Permisos de la cuenta con la que corren las funciones: firmar tokens de
      # acceso (login), leer y escribir la base (Realtime Database) y administrar Auth.
      - name: Permisos de las funciones
        run: |
          NUM=$(gcloud projects describe "$PROYECTO" --format='value(projectNumber)')
          SA="$NUM-compute@developer.gserviceaccount.com"
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --member="serviceAccount:$SA" --role="roles/iam.serviceAccountTokenCreator" \
            --project "$PROYECTO" >/dev/null
          for ROL in roles/firebasedatabase.admin roles/firebaseauth.admin; do
            gcloud projects add-iam-policy-binding "$PROYECTO" --member="serviceAccount:$SA" \
              --role="$ROL" --condition=None >/dev/null
          done
          echo "Permisos listos para $SA"

      - name: Probar el login (usuario inventado y login correcto con un usuario temporal)
        run: |
          sleep 45
          node functions/prueba-despliegue.test.js

      - name: Registro de errores del login (si algo falló)
        if: failure()
        run: |
          gcloud functions logs read login --region us-central1 --gen2 --limit 40 --project "$PROYECTO" || true
